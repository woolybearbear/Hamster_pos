    exportCSV('WM熊窩_進貨紀錄_'+today()+'.csv', rows, ['時間','商品名稱','歸屬闆娘','進貨數量','進貨前庫存','進貨後庫存','備註']);
  });
}

function openProdModal(id) {
  const p = id ? products.find(x => x.id===id) : null;
  const cats = [...new Set(products.map(x=>x.cat))];
  let editVariants = (p?.variants || []).map(v => ({...v}));
  const ov = document.createElement('div'); ov.className='ovm';
  ov.innerHTML =
    '<div class="modal">' +
      '<div class="mhd"><div class="mttl">' + (p?'編輯商品':'新增商品') + '</div><button class="btn-g" id="pm-x">' + IC.x + '</button></div>' +
      '<div class="mbd" style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="fg" style="margin:0"><label>商品名稱</label><input class="fi" id="pf-nm" placeholder="請輸入商品名稱" value="' + (p?.name||'') + '"></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<div class="fg" style="margin:0"><label>分類</label><select class="fs" id="pf-cat">' + cats.map(c=>'<option'+(p?.cat===c?' selected':'')+'>'+c+'</option>').join('') + '<option value="_new">＋ 新增分類</option></select></div>' +
          '<div class="fg" style="margin:0"><label>歸屬闆娘</label><select class="fs" id="pf-own">' + shopConfig.owners.map(o => '<option'+(p?.owner===o?' selected':'')+'>'+o+'</option>').join('') + '<option value="共同"'+(p?.owner==="共同"?' selected':'')+'>⚖ 共同均攤</option></select></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<div class="fg" style="margin:0"><label>售價（元）</label><input class="fi" type="number" id="pf-pr" placeholder="0" value="' + (p?.price||'') + '"></div>' +
          '<div class="fg" style="margin:0"><label>成本（元）</label><input class="fi" type="number" id="pf-co" placeholder="0" value="' + (p?.cost||'') + '"></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:2fr 1fr;gap:10px">' +
          '<div class="fg" style="margin:0"><label id="pf-st-lbl">庫存數量</label><input class="fi" type="number" id="pf-st" placeholder="0" value="' + (p?.stock||'') + '"></div>' +
          '<div class="fg" style="margin:0"><label>單位</label><input class="fi" id="pf-un" placeholder="個" value="' + (p?.unit||'') + '"></div>' +
        '</div>' +
        '<div class="fg" style="margin:0"><label>低庫存警示值</label><input class="fi" type="number" id="pf-lo" value="' + (p?.lowStock||5) + '"></div>' +
        '<div class="fg" style="margin:0"><label>條碼 / SKU</label><input class="fi" id="pf-bc" placeholder="選填" value="' + (p?.barcode||'') + '"></div>' +
        '<div class="fg" style="margin:0"><label>規格說明 <span style="font-size:11px;font-weight:400;color:var(--txt3)">（選填，例：顏色、尺寸、材質…）</span></label><textarea class="fi" id="pf-sp" rows="3" placeholder="例：黑色 / 30cm×20cm / 棉質" style="resize:vertical;line-height:1.6;min-height:72px">' + (p?.spec||'') + '</textarea></div>' +
        '<div class="fg" style="margin:0;padding-top:6px;border-top:1px solid var(--bd)">' +
          '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600"><input type="checkbox" id="pf-var-toggle" style="width:16px;height:16px"' + (editVariants.length?' checked':'') + '> 這個商品有多種規格可選（例如顏色、尺寸），結帳前要讓客人先選規格</label>' +
        '</div>' +
        '<div id="pf-variants-wrap" style="display:none;flex-direction:column;gap:8px;padding:12px;background:var(--p2);border-radius:var(--r)">' +
          '<div id="pf-var-list" style="display:flex;flex-direction:column;gap:6px"></div>' +
          '<button type="button" class="btn btn-o btn-sm" id="pf-var-add" style="align-self:flex-start">＋ 新增規格</button>' +
          '<div style="font-size:11px;color:var(--txt3)">每個規格可以各自設定庫存，上面的「庫存數量」會自動變成所有規格的加總，不用手動填。</div>' +
        '</div>' +
      '</div>' +
      '<div class="mft"><button class="btn btn-o" id="pm-cancel">取消</button><button class="btn btn-p" id="pm-save">' + IC.check + ' 儲存</button></div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#pm-x').addEventListener('click', close);
  ov.querySelector('#pm-cancel').addEventListener('click', close);

  // 店員模式：售價/成本屬於「商品定價修改」，只有闆娘能改
  if (isStaffMode()) {
    ['pf-pr', 'pf-co'].forEach(id => {
      const el = ov.querySelector('#' + id);
      if (el) { el.disabled = true; el.style.background = 'var(--p2)'; el.style.cursor = 'not-allowed'; el.title = '僅限闆娘修改'; }
    });
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:11px;color:var(--txt3);margin-top:-8px;margin-bottom:4px';
    hint.textContent = '🔒 售價／成本僅限闆娘修改';
    ov.querySelector('#pf-co')?.closest('.fg')?.after(hint);
  }

  const varWrap = ov.querySelector('#pf-variants-wrap');
  const varList = ov.querySelector('#pf-var-list');
  const stInput = ov.querySelector('#pf-st');
  const stLbl   = ov.querySelector('#pf-st-lbl');
  const toggle  = ov.querySelector('#pf-var-toggle');

  function renderVarRows() {
    varList.innerHTML = editVariants.map((v,i) =>
      '<div style="display:flex;gap:6px;align-items:center" data-vi="'+i+'">' +
        '<input class="fi var-nm" data-vi="'+i+'" placeholder="規格名稱，例：紅色 / M 號" value="'+(v.name||'')+'" style="flex:2">' +
        '<input class="fi var-st" data-vi="'+i+'" type="number" placeholder="庫存" value="'+(v.stock??0)+'" style="flex:1;min-width:0">' +
        '<button type="button" class="btn-g var-del" data-vi="'+i+'" style="flex:none;color:#b71c1c">' + IC.x + '</button>' +
      '</div>'
    ).join('') || '<div style="font-size:12px;color:var(--txt3)">尚未新增規格，點下方按鈕新增第一個</div>';
  }
  function syncStockTotal() {
    if (toggle.checked) {
      const total = editVariants.reduce((s,v)=>s+(parseInt(v.stock)||0),0);
      stInput.value = total;
      stInput.disabled = true;
      stLbl.textContent = '庫存數量（自動加總）';
    } else {
      stInput.disabled = false;
      stLbl.textContent = '庫存數量';
    }
  }
  function refreshVarUI() {
    varWrap.style.display = toggle.checked ? 'flex' : 'none';
    renderVarRows();
    syncStockTotal();
  }
  toggle.addEventListener('change', refreshVarUI);
  ov.querySelector('#pf-var-add').addEventListener('click', () => {
    editVariants.push({ id: 'V'+Date.now()+Math.random().toString(36).slice(2,6), name:'', stock:0 });
    renderVarRows(); syncStockTotal();
  });
  varList.addEventListener('input', e => {
    const vi = e.target.dataset.vi; if (vi === undefined) return;
    if (e.target.classList.contains('var-nm')) editVariants[vi].name = e.target.value;
    if (e.target.classList.contains('var-st')) { editVariants[vi].stock = parseInt(e.target.value)||0; syncStockTotal(); }
  });
  varList.addEventListener('click', e => {
    const btn = e.target.closest('.var-del'); if (!btn) return;
    editVariants.splice(parseInt(btn.dataset.vi), 1);
    renderVarRows(); syncStockTotal();
  });
  refreshVarUI();

  ov.querySelector('#pm-save').addEventListener('click', () => {
    let cat = ge('pf-cat').value;
    if (cat === '_new') { cat = prompt('輸入新分類名稱：') || '其他'; }
    const useVariants = toggle.checked;
    const finalVariants = useVariants ? editVariants.filter(v => v.name && v.name.trim()).map(v => ({id:v.id, name:v.name.trim(), stock:Math.max(0,parseInt(v.stock)||0)})) : [];
    const stockVal = useVariants ? finalVariants.reduce((s,v)=>s+v.stock,0) : (+ge('pf-st').value || 0);
    const data = {name:ge('pf-nm').value.trim(),cat,owner:ge('pf-own').value,price:+ge('pf-pr').value,cost:+ge('pf-co').value,stock:stockVal,unit:ge('pf-un').value.trim(),lowStock:+ge('pf-lo').value||5,barcode:ge('pf-bc').value.trim(),spec:ge('pf-sp').value.trim(),variants:finalVariants};
    if (!data.name||!data.price) { alert('請填寫商品名稱與售價'); return; }
    if (useVariants && !finalVariants.length) { alert('已勾選「有多種規格」，請至少新增一個規格選項，或取消勾選'); return; }
    if (id) { const i=products.findIndex(p=>p.id===id); products[i]={...products[i],...data}; }
    else { const maxOrder = products.reduce((m,p) => Math.max(m, p.sortOrder??0), -1); products.push({id:'P'+Date.now(),...data, sortOrder: maxOrder+1}); }
    close(); saveToLocal(); PF.inventory();
  });
}

          '<button class="btn btn-o btn-sm' + (_weekStart===ordDateFrom&&_today===ordDateTo?' btn-p':'') + '" id="ord-dt-week">本週</button>' +
          '<button class="btn btn-o btn-sm' + (_monthStart===ordDateFrom&&_today===ordDateTo?' btn-p':'') + '" id="ord-dt-month">本月</button>' +
          (ordDateFrom||ordDateTo ? '<button class="btn btn-d btn-sm" id="ord-dt-clr">✕ 清除</button>' : '') +
        '</div>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<input type="date" id="ord-from" value="' + ordDateFrom + '" style="flex:1;height:32px;padding:0 8px;border:1.5px solid var(--p3);border-radius:var(--r);font-size:12px;color:var(--txt1);background:var(--bg);min-width:0">' +
          '<span style="font-size:12px;color:var(--txt3);flex-shrink:0">–</span>' +
          '<input type="date" id="ord-to" value="' + ordDateTo + '" style="flex:1;height:32px;padding:0 8px;border:1.5px solid var(--p3);border-radius:var(--r);font-size:12px;color:var(--txt1);background:var(--bg);min-width:0">' +

         ordTab==='active'   ? '目前沒有待處理訂單' :

                (o.status==='處理中' ? '<button class="btn btn-p btn-sm ord-done" data-oid="'+o.id+'">' + IC.check + '</button>' : '') +
                ((o.status==='完成'||o.status==='部分退款') ? '<button class="btn btn-o btn-sm ord-ref" data-oid="'+o.id+'">退款</button>' : '') +

  ge('ord-act').addEventListener('click',     () => { ordTab='active';   PF.orders(); });

  ge('ord-dt-today')?.addEventListener('click', () => { ordDateFrom=_today; ordDateTo=_today; PF.orders(); });
  ge('ord-dt-week')?.addEventListener('click',  () => { ordDateFrom=_weekStart; ordDateTo=_today; PF.orders(); });
  ge('ord-dt-month')?.addEventListener('click', () => { ordDateFrom=_monthStart; ordDateTo=_today; PF.orders(); });
  ge('ord-dt-clr')?.addEventListener('click',   () => { ordDateFrom=''; ordDateTo=''; PF.orders(); });
  ge('ord-from')?.addEventListener('change', function() { ordDateFrom=this.value; PF.orders(); });
  ge('ord-to')?.addEventListener('change',   function() { ordDateTo=this.value;   PF.orders(); });
  if (selOrder) ge('ord-x')?.addEventListener('click', () => { selOrder=null; PF.orders(); });
  if (selOrder) ge('ord-print')?.addEventListener('click', () => {
    const mem = selOrder.memberId ? members.find(m => m.id === selOrder.memberId) : null;
    showReceiptModal(selOrder, mem, () => PF.orders());
  });

  // 訂單備註編輯
  ge('ord-note-edit')?.addEventListener('click', () => {
    ge('ord-note-view').style.display = 'none';
    ge('ord-note-edit').style.display = 'none';
    ge('ord-note-edit-area').style.display = 'block';
    ge('ord-note-inp').focus();
  });
  ge('ord-note-cancel')?.addEventListener('click', () => {
    ge('ord-note-view').style.display = 'block';
    ge('ord-note-edit').style.display = '';
    ge('ord-note-edit-area').style.display = 'none';
  });
  ge('ord-note-save')?.addEventListener('click', async () => {
    const newNote = ge('ord-note-inp').value.trim();
    selOrder.note = newNote;
    const ord = orders.find(o => o.id === selOrder.id);
    if (ord) ord.note = newNote;
    saveToLocal();
    // 直接、單獨寫入這一筆訂單到雲端並等待完成，避免整批同步還沒跑完就被使用者刷新蓋掉
    if (fbReady && ord) {
      try { await saveDocToFB('orders', ord.id, ord); markItemSynced('orders', ord); }
      catch(e) { console.warn('備註同步失敗:', e); showToast('⚠ 備註已存本機，但雲端同步失敗，請確認網路'); }
    }
    showToast('備註已更新');
    PF.orders();
  });

  ge('pg').querySelector('tbody').querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      selOrder = orders.find(o => o.id===tr.dataset.oid);
      PF.orders();
    });
  });
  ge('pg').querySelectorAll('.ord-done').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    const o = orders.find(x=>x.id===b.dataset.oid); if(o) o.status='完成';
    if (selOrder?.id===b.dataset.oid) selOrder.status='完成';
    saveToLocal();
    if (fbReady && o) { try { await saveDocToFB('orders', o.id, o); markItemSynced('orders', o); } catch(e) { console.warn(e); } }
    PF.orders();
  }));
  ge('pg').querySelectorAll('.ord-ref').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const o = orders.find(x=>x.id===b.dataset.oid); if (!o) return;
    openRefundModal({
      title: '整筆退款',
      desc: '訂單 ' + o.id + '　合計 ' + fm(o.total),
      onConfirm: async (note, qty, defective) => {
        // 記錄退款前原始金額（供查詢用），並將合計歸零，避免整筆退款的訂單仍被算入營收
        o.originalTotal = o.originalTotal != null ? o.originalTotal : o.total;
        const refundedAmt = o.total;
        o.status = '退款';
        o.refundNote = note;
        o.items.forEach(it => { it.refunded = true; it.refundedQty = it.qty; });
        o.total = 0;
        // restore member points & totalSpend for full order
        if (o.memberId) {
          const mem = members.find(m => m.id===o.memberId);
          if (mem) {
            const ptsToDeduct = Math.floor(refundedAmt / 100);
            mem.points     = Math.max(0, mem.points - ptsToDeduct);
            mem.totalSpend = Math.max(0, mem.totalSpend - refundedAmt);
            mem.tier       = getTierIdBySpend(mem.totalSpend);
          }
        }
        // restore stock（瑕疵商品不還原）
        if (!defective) {
          o.items.forEach(it => restoreStock(it, it.qty));
        }
        if (selOrder?.id===o.id) selOrder = o;
        saveToLocal();
        if (fbReady) { try { await saveDocToFB('orders', o.id, o); markItemSynced('orders', o); } catch(e) { console.warn('退款同步失敗:', e); } }
        showToast('已退款：' + o.id);
        PF.orders();
      }
    });
  }));
  ge('pg').querySelectorAll('.ord-del').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm('確定刪除此筆訂單？')) return;
    const delId = b.dataset.oid;
    if (selOrder?.id===delId) selOrder=null;
    orders = orders.filter(o => o.id!==delId);
    saveToLocal();
    if (fbReady) { try { await deleteDocFromFB('orders', delId); } catch(e) { console.warn(e); } }
    PF.orders();
  }));

  // Item-level refund
  ge('pg').querySelectorAll('.item-refund').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const ord = orders.find(o=>o.id===b.dataset.oid);
    const idx = parseInt(b.dataset.idx);
    if (!ord) return;
    const item = ord.items[idx];
    const maxQty = parseInt(b.dataset.max) || item.qty;
    openRefundModal({
      title: '單項退款',
      desc: item.name + ' ×' + item.qty,
      maxQty,
      unitPrice: item.price,
      onConfirm: async (note, qty, defective) => {
        const refundQty = qty || maxQty;
        const refundAmt = item.price * refundQty;
        ord.items[idx].refundedQty = (ord.items[idx].refundedQty || 0) + refundQty;
        ord.items[idx].refunded = ord.items[idx].refundedQty >= item.qty;
        ord.total = Math.max(0, ord.total - refundAmt);
        if (!ord.refundNote) ord.refundNote = note;
        else if (note) ord.refundNote += '；' + note;
        // 瑕疵商品不還原庫存
        if (!defective) {
          restoreStock(item, refundQty);
        }
        // 全部都退完 → 退款；有部分退款 → 部分退款（讓已退款頁面看得到）
        const allFullyRefunded = ord.items.every(it => (it.refundedQty||0) >= it.qty);
        const hasAnyRefund     = ord.items.some(it  => (it.refundedQty||0) > 0);
        if (allFullyRefunded) ord.status = '退款';
        else if (hasAnyRefund) ord.status = '部分退款';
        if (ord.memberId) {
          const mem = members.find(m => m.id===ord.memberId);
          if (mem) {
            const ptsToDeduct = Math.floor(refundAmt / 100);
            mem.points     = Math.max(0, mem.points - ptsToDeduct);
            mem.totalSpend = Math.max(0, mem.totalSpend - refundAmt);
            mem.tier       = getTierIdBySpend(mem.totalSpend);
          }
        }
        if (selOrder?.id===ord.id) selOrder = ord;
        saveToLocal();
        if (fbReady) { try { await saveDocToFB('orders', ord.id, ord); markItemSynced('orders', ord); } catch(e) { console.warn('退款同步失敗:', e); } }
        showToast('已退款：' + item.name + ' ×' + refundQty + '　' + fm(refundAmt));
        PF.orders();
      }
    });
  }));
  // bulk select
  makeBulkBar('ord-wrap',
    () => list.map(o => o.id),
    ids => {
      if (selOrder && ids.includes(selOrder.id)) selOrder = null;
      orders = orders.filter(o => !ids.includes(o.id));
    },
    () => PF.orders(),
    'orders'
  );
};

function exportOrdersToExcel(dateFrom, dateTo, labelForFile) {
  if (typeof XLSX === 'undefined') { showToast('試算表套件尚未載入，請稍後再試'); return; }
  const list = orders.filter(o => (o.status==='完成'||o.status==='部分退款'||o.status==='退款')
      && (!dateFrom || o.date >= dateFrom) && (!dateTo || o.date <= dateTo))
    .slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if (!list.length) { showToast('此範圍內沒有訂單可匯出'); return; }
  const headers = ['訂單編號','日期','客戶','會員ID','付款','折扣%','折扣額','折扣金','原始金額','實收總額','狀態','備註','退款備註'];
  const aoa = [headers];
  const months = [...new Set(list.map(o=>(o.date||'').slice(0,7)))];
  let grandTotal = 0;
  months.forEach(m => {
    const monthOrders = list.filter(o=>(o.date||'').slice(0,7)===m);
    monthOrders.forEach(o => {
      const original = o.originalTotal != null ? o.originalTotal : o.total;
      aoa.push([o.id,o.date,o.customer,o.memberId||'散客',o.payment,o.discPct+'%',o.discAmt,o.discFix,original,o.total,o.status,o.note||'',o.refundNote||'']);
    });
    const monthTotal = monthOrders.reduce((s,o)=>s+o.total,0);
    grandTotal += monthTotal;
    aoa.push(['','','','','','','','',m+' 當月總計',monthTotal,'','','']);
    aoa.push([]);
  });
  aoa.push(['','','','','','','','','範圍總計',grandTotal,'','','']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14},{wch:11},{wch:10},{wch:10},{wch:8},{wch:7},{wch:8},{wch:8},{wch:10},{wch:14},{wch:10},{wch:24},{wch:24}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '訂單報表');
  XLSX.writeFile(wb, 'WM熊窩_訂單報表_' + (labelForFile || today()) + '.xlsx');
}

function openOrderExportModal() {
  const _today = today();
  const _thisMonthStart = _today.slice(0,7) + '-01';
  const _lastMonthDate = new Date(); _lastMonthDate.setDate(1); _lastMonthDate.setMonth(_lastMonthDate.getMonth()-1);
  const _lastMonthStart = localDateStr(_lastMonthDate).slice(0,7) + '-01';
  const _lastMonthEndDate = new Date(_lastMonthDate.getFullYear(), _lastMonthDate.getMonth()+1, 0);
  const _lastMonthEnd = localDateStr(_lastMonthEndDate);

  const ov = document.createElement('div'); ov.className = 'ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:400px">' +
      '<div class="mhd"><div class="mttl">匯出訂單 Excel</div><button class="btn-g" id="oe-x">' + IC.x + '</button></div>' +
      '<div class="mbd" style="padding:18px 20px">' +
        '<div style="font-size:11px;font-weight:700;color:var(--txt3);letter-spacing:.5px;margin-bottom:8px">快速選擇範圍</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">' +
          '<button class="btn btn-o btn-sm" id="oe-all">全部訂單</button>' +
          '<button class="btn btn-o btn-sm" id="oe-this-month">本月</button>' +
          '<button class="btn btn-o btn-sm" id="oe-last-month">上個月</button>' +
        '</div>' +
        '<div style="font-size:11px;font-weight:700;color:var(--txt3);letter-spacing:.5px;margin-bottom:8px">或自訂日期範圍</div>' +
        '<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">' +
          '<input type="date" id="oe-from" class="fi" style="flex:1">' +
          '<span style="font-size:12px;color:var(--txt3)">–</span>' +
          '<input type="date" id="oe-to" class="fi" style="flex:1">' +
        '</div>' +
        '<div style="font-size:11px;color:var(--txt3)">留空 = 不限制起始／結束日期</div>' +
      '</div>' +
      '<div class="mft"><button class="btn btn-o" id="oe-cancel">取消</button><button class="btn btn-p" id="oe-confirm">' + IC.dl + ' 匯出</button></div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#oe-x').addEventListener('click', close);
  ov.querySelector('#oe-cancel').addEventListener('click', close);

  const fromInp = ov.querySelector('#oe-from'), toInp = ov.querySelector('#oe-to');
  ov.querySelector('#oe-all').addEventListener('click', () => { fromInp.value=''; toInp.value=''; });
  ov.querySelector('#oe-this-month').addEventListener('click', () => { fromInp.value=_thisMonthStart; toInp.value=_today; });
  ov.querySelector('#oe-last-month').addEventListener('click', () => { fromInp.value=_lastMonthStart; toInp.value=_lastMonthEnd; });

  ov.querySelector('#oe-confirm').addEventListener('click', () => {
    const from = fromInp.value, to = toInp.value;
    if (from && to && from > to) { showToast('起始日期不能晚於結束日期'); return; }
    const label = from||to ? (from||'起') + '_' + (to||'今') : today();
    close();
    exportOrdersToExcel(from, to, label);
  });
}

  exportOrderBtn.addEventListener('click', openOrderExportModal);
  const exportRestockBtn = document.createElement('button');
  exportRestockBtn.className='btn btn-o rpt-exp-btn'; exportRestockBtn.innerHTML=IC.dl+'<span class="btn-txt"> 匯出進貨紀錄</span>';exportRestockBtn.title='匯出進貨紀錄';
  exportRestockBtn.addEventListener('click', () => {
    if (!restockLog.length) { showToast('尚無進貨紀錄可匯出'); return; }
    const rows = restockLog.map(r=>[r.ts, r.name, r.owner, r.qty, r.before, r.after, r.note||'']);
    exportCSV('WM熊窩_進貨紀錄_'+today()+'.csv', rows, ['時間','商品名稱','歸屬闆娘','進貨數量','進貨前庫存','進貨後庫存','備註']);
  });
  ge('tb-act').innerHTML='';
  ge('tb-act').appendChild(exportRestockBtn);
  ge('tb-act').appendChild(exportOrderBtn);

  const thisMonth = today().slice(0,7);  // YYYY-MM
  // 已結案訂單：完成 / 部分退款（保留未退部分金額）。全額退款訂單 total 已歸零，不列入筆數與均價統計，避免拉低客單價。
  const done   = orders.filter(o=>o.status==='完成'||o.status==='部分退款');
  const doneM  = done.filter(o=>o.date.startsWith(thisMonth));  // 本月
  // 品項實際淨數量（扣除已退款數量），退貨商品已回補庫存，不應計入成本／熱銷排行
  const netQty = it => Math.max(0, it.qty - (it.refundedQty || (it.refunded ? it.qty : 0)));

  // 本月統計
  const totalRevM  = doneM.reduce((s,o)=>s+o.total,0);
  const avgOrdM    = doneM.length ? Math.round(totalRevM/doneM.length) : 0;
  const totalCostM = doneM.reduce((s,o)=>s+o.items.reduce((ss,it)=>{const p=products.find(x=>x.name===it.name);return ss+(p?p.cost*netQty(it):0);},0),0);
  const marginM    = totalRevM ? Math.round(((totalRevM-totalCostM)/totalRevM)*100) : 0;

  // 累計統計
  const totalRev  = done.reduce((s,o)=>s+o.total,0);
  const avgOrd    = done.length ? Math.round(totalRev/done.length) : 0;
  const totalCost = done.reduce((s,o)=>s+o.items.reduce((ss,it)=>{const p=products.find(x=>x.name===it.name);return ss+(p?p.cost*netQty(it):0);},0),0);
  const margin    = totalRev ? Math.round(((totalRev-totalCost)/totalRev)*100) : 0;

  const lowCount = products.filter(p=>p.stock<=p.lowStock).length;
  // 近 7 天真實銷售資料
  const DAY_LABELS = ['日','一','二','三','四','五','六'];
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const dateStr = localDateStr(d);
    const v = done.filter(o=>o.date===dateStr).reduce((s,o)=>s+o.total,0);
    return { l: (d.getMonth()+1)+'/'+ d.getDate(), sub: '週'+DAY_LABELS[d.getDay()], v };
  });
  const maxV = Math.max(...days.map(d=>d.v), 1);
  // 本月熱銷（以淨數量計算，退款品項不計入排行）
  const itemRevM = {};
  doneM.forEach(o=>o.items.forEach(it=>{const q=netQty(it); if(q>0) itemRevM[it.name]=(itemRevM[it.name]||0)+q*it.price;}));
  const topItemsM = Object.entries(itemRevM).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // 累計熱銷（以淨數量計算，退款品項不計入排行）
  const itemRev = {};
  done.forEach(o=>o.items.forEach(it=>{const q=netQty(it); if(q>0) itemRev[it.name]=(itemRev[it.name]||0)+q*it.price;}));
  const topItems = Object.entries(itemRev).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const ymLabel = thisMonth.replace('-','/');
  ge('pg').innerHTML =
    // ── 本月 4 卡 ──
    '<div style="margin-bottom:6px;font-size:11.5px;font-weight:700;color:var(--txt3);letter-spacing:.5px">' + ymLabel + ' 本月</div>' +
    '<div class="sg4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">' +
      [
        {lbl:'本月營業額', val:fm(totalRevM),  sub:'共 '+doneM.length+' 筆'},
        {lbl:'本月客單價', val:fm(avgOrdM),    sub:'完成訂單'},
        {lbl:'本月毛利率', val:marginM+'%',    sub:'毛利 '+fm(totalRevM-totalCostM)},
        {lbl:'低庫存商品', val:lowCount,        sub:'件需補貨'}
      ].map(s=>'<div class="sc"><div class="sc-acc"></div><div class="sc-lbl">'+s.lbl+'</div><div class="sc-val">'+s.val+'</div><div class="sc-sub">'+s.sub+'</div></div>').join('') +
    '</div>' +
    '<div style="margin-bottom:6px;font-size:11.5px;font-weight:700;color:var(--txt3);letter-spacing:.5px">累計（全部時間）</div>' +
    '<div class="sg3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">' +
      [
        {lbl:'累計營業額', val:fm(totalRev),  sub:'共 '+done.length+' 筆'},
        {lbl:'累計客單價', val:fm(avgOrd),    sub:'完成訂單'},
        {lbl:'累計毛利率', val:margin+'%',    sub:'毛利 '+fm(totalRev-totalCost)}
      ].map(s=>'<div class="sc"><div class="sc-acc" style="background:var(--txt3)"></div><div class="sc-lbl" style="color:var(--txt3)">'+s.lbl+'</div><div class="sc-val" style="font-size:18px">'+s.val+'</div><div class="sc-sub">'+s.sub+'</div></div>').join('') +
    '</div>' +
    '<div class="sg2c" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">' +
      '<div class="card"><div class="card-hd"><span class="card-ttl">近 7 天每日銷售</span><span style="font-size:11px;color:var(--txt3);font-weight:400">（實際訂單）</span></div><div style="padding:14px 18px">' +
        '<div class="bc">' + days.map(d=>'<div class="bcol"><span class="bv" style="font-size:9px">'+(d.v===0?'—':d.v>=1000?(d.v/1000).toFixed(1)+'k':d.v)+'</span><div class="bar" style="height:'+Math.round(d.v/maxV*100)+'%;opacity:'+(d.v===0?'.2':'1')+'"></div><span class="bl">'+d.l+'</span><span style="font-size:8.5px;color:var(--txt3);font-family:var(--zh)">'+d.sub+'</span></div>').join('') + '</div>' +
      '</div></div>' +
      '<div class="card"><div class="card-hd"><span class="card-ttl">熱銷商品排行</span><span style="font-size:11px;color:var(--txt3);font-weight:400">'+ymLabel+' 本月</span></div><div style="padding:14px 18px">' +
        (topItemsM.length===0 ? '<div style="color:var(--txt3);font-size:13px">本月尚無銷售資料</div>' :
          topItemsM.map(([name,rev],i)=>
            '<div class="ti"><span class="ti-rk" style="color:'+(i===0?'#B8860B':i===1?'#999':i===2?'#CD7F32':'var(--txt3)')+'">'+i+1+'</span>' +
            '<div class="ti-bw"><div class="ti-lb">'+name+'</div><div class="ti-tr"><div class="ti-fi" style="width:'+Math.round(rev/topItemsM[0][1]*100)+'%"></div></div></div>' +
            '<span class="ti-vl">'+fm(rev)+'</span></div>'
          ).join('')) +
        '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--p2)">' +
          '<div style="font-size:11px;color:var(--txt3);font-weight:700;margin-bottom:6px">累計 Top 5（全部時間）</div>' +
          (topItems.length===0 ? '<div style="color:var(--txt3);font-size:12px">尚無資料</div>' :
            topItems.map(([name,rev],i)=>
              '<div class="ti" style="opacity:.7"><span class="ti-rk" style="color:var(--txt3);font-size:11px">'+i+1+'</span>' +
              '<div class="ti-bw"><div class="ti-lb" style="font-size:12px">'+name+'</div><div class="ti-tr"><div class="ti-fi" style="width:'+Math.round(rev/topItems[0][1]*100)+'%;background:var(--txt3)"></div></div></div>' +
              '<span class="ti-vl" style="font-size:11px;color:var(--txt3)">'+fm(rev)+'</span></div>'
            ).join('')) +
        '</div>' +
      '</div></div>' +
    '</div>' +
    '<div class="card"><div class="card-hd"><span class="card-ttl">商品進銷存摘要</span></div><div class="tw"><table>' +
      '<thead><tr><th>商品名稱</th><th>闆娘</th><th>分類</th><th>售價</th><th>成本</th><th>毛利率</th><th>庫存</th><th>狀態</th></tr></thead><tbody>' +
      products.map(p=>{const gr=Math.round(((p.price-p.cost)/p.price)*100);return '<tr><td style="font-weight:500">'+p.name+'</td><td>'+ownerTag(p.owner)+'</td><td><span class="bdg bi">'+p.cat+'</span></td><td class="tn">'+fm(p.price)+'</td><td class="tn" style="color:var(--txt3)">'+fm(p.cost)+'</td><td class="tn" style="color:'+(gr>=50?'#1e6b2e':gr>=30?'#7a5800':'#b71c1c')+';font-weight:700">'+gr+'%</td><td class="tn">'+p.stock+' '+p.unit+'</td><td>'+(p.stock===0?'<span class="bdg br">缺貨</span>':p.stock<=p.lowStock?'<span class="bdg ba">偏低</span>':'<span class="bdg bg">正常</span>')+'</td></tr>';}).join('') +
      '</tbody></table></div></div>';
};

// ══════════════════════════════════════
// SPLIT PAGE
// ══════════════════════════════════════
PF.split = function() {
  // 已結案訂單：完成 / 部分退款 / 退款（退款訂單的品項會在 itNet() 中被扣為 0，不影響加總，但仍納入避免遺漏）
  const done = orders.filter(o=>o.status==='完成'||o.status==='部分退款'||o.status==='退款');

  // ── 折扣分攤：每筆訂單折扣按品項比例分配，再扣除該品項已退款金額 ──
  function itBreakdown(o, it) {
    const rawSub = o.items.reduce((s,x) => s + x.price*x.qty, 0);
    const totalDisc = (o.discAmt||0) + (o.discFix||0) + (o.ptDeduct||0);
    const ratio = rawSub > 0 ? (it.price*it.qty) / rawSub : 0;
    const gross = it.price*it.qty;
    const discShare = Math.round(totalDisc*ratio);
    const refundedQty = it.refundedQty || (it.refunded ? it.qty : 0);
    const refundedAmt = refundedQty * it.price;
    const net = Math.max(0, gross - discShare - refundedAmt);
    return { gross, discShare, refundedQty, refundedAmt, net };
  }
  function itNet(o, it) { return itBreakdown(o, it).net; }

  const [o1,o2] = shopConfig.owners;
  // 品項實際淨數量（扣除已退款數量），退貨商品已回補庫存，不應計入成本
  const netQty = it => Math.max(0, it.qty - (it.refundedQty || (it.refunded ? it.qty : 0)));

  // ── toolbar：均攤切換 + 匯出 ──
  const modeBtn = document.createElement('button');
  modeBtn.className = 'btn ' + (splitMode==='equal' ? 'btn-p' : 'btn-o');
  modeBtn.innerHTML = splitMode==='equal' ? '⚖ 均攤模式（切換）' : '⚖ 切換均攤模式';
  modeBtn.addEventListener('click', () => { splitMode = splitMode==='own'?'equal':'own'; PF.split(); });
  const exportBtn = document.createElement('button');
  exportBtn.className='btn btn-o'; exportBtn.innerHTML=IC.dl+' 匯出分帳 CSV';
  exportBtn.addEventListener('click', () => {
    const rows = [];
    done.forEach(o => {
      o.items.forEach(it => {
        const bd = itBreakdown(o, it);
        const equalShare = Math.round(bd.net / 2);
        rows.push([o.id, o.date, it.owner, it.name, it.cat, it.qty, it.price,
          bd.gross, bd.discShare, bd.refundedQty, bd.refundedAmt, Math.round(bd.net),
          splitMode==='equal' ? equalShare : '—', splitMode==='equal' ? equalShare : '—']);
      });
    });
    exportCSV('WM熊窩_分帳報表_'+today()+'.csv', rows,
      ['訂單編號','日期','歸屬闆娘','商品名稱','分類','數量','單價','原始小計','分攤折扣','已退數量','已退金額','實收金額',o1+'均攤',o2+'均攤']);
  });
  ge('tb-act').innerHTML='';
  ge('tb-act').appendChild(modeBtn);
  ge('tb-act').appendChild(exportBtn);

  // ── 各闆娘統計 ──
  const calc = owner => {
    let rev=0, gross=0, cost=0;
    done.forEach(o => o.items.forEach(it => {
      const net = itNet(o, it);
      const p   = products.find(x=>x.name===it.name);
      const c   = p ? p.cost*netQty(it) : 0;
      if (it.owner === owner) {
        rev += net; gross += it.price*it.qty; cost += c;
      } else if (it.owner === '共同') {
        rev += net/2; gross += it.price*it.qty/2; cost += c/2;
      }
    }));
    return { rev: Math.round(rev), gross: Math.round(gross), cost: Math.round(cost),
             profit: Math.round(rev-cost), margin: rev ? Math.round(((rev-cost)/rev)*100) : 0 };
  };
  const W=calc(o1), M=calc(o2);
  const total = W.rev + M.rev;
  const wPct = total ? Math.round(W.rev/total*100) : 50;
  const mPct = 100-wPct;

  // ── 均攤計算 ──
  // 總成本各自算，總營收對半分，再用「各自拿到的均攤收入 - 各自的商品成本」算利潤
  const half = Math.round(total / 2);
  const wEqual = { take: half, cost: W.cost, profit: half - W.cost, margin: half ? Math.round(((half-W.cost)/half)*100) : 0 };
  const mEqual = { take: total - half, cost: M.cost, profit: (total-half) - M.cost, margin: (total-half) ? Math.round((((total-half)-M.cost)/(total-half))*100) : 0 };
  // 差額：正數 = o1 要補給 o2，負數 = o2 要補給 o1
  const diff = half - W.rev;

  // ── 各商品統計 ──
  const prodSplit={};
  done.forEach(o => o.items.forEach(it => {
    if (!prodSplit[it.name]) prodSplit[it.name]={name:it.name,owner:it.owner,qty:0,gross:0,rev:0};
    prodSplit[it.name].qty   += it.qty;
    prodSplit[it.name].gross += it.price*it.qty;
    prodSplit[it.name].rev   += itNet(o, it);
  }));
  const prodRows = Object.values(prodSplit)
    .map(r => ({...r, rev: Math.round(r.rev), gross: Math.round(r.gross)}))
    .sort((a,b) => b.rev - a.rev);
  const sharedRev = prodRows.filter(r=>r.owner==='共同').reduce((s,r)=>s+r.rev,0);
  const sharedRevHalf = Math.round(sharedRev/2);

  ge('pg').innerHTML =
    // ── 模式提示 ──
    (splitMode==='equal'
      ? '<div style="background:var(--p2);border:1.5px solid var(--p3);border-radius:var(--r);padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px">⚖ <strong>均攤模式</strong>：總實收對半平分，成本各自負擔，計算每人應得金額與補貼方向。</div>'
      : '') +

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:16px">' +
      '<div class="sc" style="border-top:3px solid var(--wooly)">' +
        '<div class="sc-lbl" style="color:var(--wooly);font-weight:700">'+o1+(splitMode==='equal'?' 商品實收':' 實收')+'</div>' +
        '<div class="sc-val" style="color:var(--wooly)">'+fm(W.rev)+'</div>' +
        '<div class="sc-sub">原始 '+fm(W.gross)+'　成本 '+fm(W.cost)+'　毛利 '+fm(W.profit)+'（'+W.margin+'%）</div>' +
        (sharedRevHalf>0?'<div style="font-size:11px;color:#7A5800;margin-top:3px">含共同均攤 +'+fm(sharedRevHalf)+'</div>':'')+
      '</div>' +
      '<div class="sc" style="border-top:3px solid var(--mumu)">' +
        '<div class="sc-lbl" style="color:var(--mumu);font-weight:700">'+o2+(splitMode==='equal'?' 商品實收':' 實收')+'</div>' +
        '<div class="sc-val" style="color:var(--mumu)">'+fm(M.rev)+'</div>' +
        '<div class="sc-sub">原始 '+fm(M.gross)+'　成本 '+fm(M.cost)+'　毛利 '+fm(M.profit)+'（'+M.margin+'%）</div>' +
        (sharedRevHalf>0?'<div style="font-size:11px;color:#7A5800;margin-top:3px">含共同均攤 +'+fm(sharedRevHalf)+'</div>':'')+
      '</div>' +
    '</div>' +

    (splitMode==='equal'
      ? '<div class="card" style="margin-bottom:16px;border:2px solid var(--p3)">' +
          '<div class="card-hd"><span class="card-ttl">⚖ 均攤結算</span><span style="font-size:11px;color:var(--txt3);font-weight:400">總實收 '+fm(total)+' ÷ 2 = 各 '+fm(half)+'</span></div>' +
          '<div style="padding:16px 20px">' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:16px">' +
              '<div style="background:var(--p2);border-radius:var(--r);padding:12px 14px">' +
                '<div style="font-size:11.5px;color:var(--wooly);font-weight:700;margin-bottom:6px">'+o1+'</div>' +
                '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="color:var(--txt3)">應得（均攤）</span><span style="font-family:var(--en);font-weight:700">'+fm(half)+'</span></div>' +
                '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="color:var(--txt3)">商品成本</span><span style="font-family:var(--en)">-'+fm(W.cost)+'</span></div>' +
                '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid var(--p3);padding-top:6px;margin-top:6px"><span>均攤後利潤</span><span style="font-family:var(--en);color:'+(wEqual.profit>=0?'var(--cr)':'#c0392b')+'">'+fm(wEqual.profit)+'</span></div>' +
              '</div>' +
              '<div style="background:var(--p2);border-radius:var(--r);padding:12px 14px">' +
                '<div style="font-size:11.5px;color:var(--mumu);font-weight:700;margin-bottom:6px">'+o2+'</div>' +
                '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="color:var(--txt3)">應得（均攤）</span><span style="font-family:var(--en);font-weight:700">'+fm(total-half)+'</span></div>' +
                '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="color:var(--txt3)">商品成本</span><span style="font-family:var(--en)">-'+fm(M.cost)+'</span></div>' +
                '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid var(--p3);padding-top:6px;margin-top:6px"><span>均攤後利潤</span><span style="font-family:var(--en);color:'+(mEqual.profit>=0?'var(--cr)':'#c0392b')+'">'+fm(mEqual.profit)+'</span></div>' +
              '</div>' +
            '</div>' +
            '<div style="background:'+(Math.abs(diff)===0?'#e9f5ea':'#fff8e6')+';border:1px solid '+(Math.abs(diff)===0?'#b8dcb9':'#ffe08a')+';border-radius:var(--r);padding:10px 16px;font-size:13px;text-align:center">' +
              (Math.abs(diff)===0
                ? '✅ 兩人收入相等，無需補貼'
                : (diff>0
                    ? '💸 <strong>'+o1+'</strong> 需補貼 <strong style="font-family:var(--en);color:var(--cr)">'+fm(diff)+'</strong> 給 <strong>'+o2+'</strong>'
                    : '💸 <strong>'+o2+'</strong> 需補貼 <strong style="font-family:var(--en);color:var(--cr)">'+fm(-diff)+'</strong> 給 <strong>'+o1+'</strong>')) +
            '</div>' +
          '</div>' +
        '</div>'
      : '') +

    '<div class="card" style="margin-bottom:16px"><div class="card-hd"><span class="card-ttl">整體分帳比例</span><span style="font-size:11px;color:var(--txt3);font-weight:400">（折扣已按比例分攤）</span></div><div style="padding:18px 20px">' +
      '<div style="height:28px;border-radius:6px;overflow:hidden;display:flex;margin-bottom:12px">' +
        '<div style="width:'+wPct+'%;background:var(--wooly);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;font-family:var(--en)">'+wPct+'%</div>' +
        '<div style="flex:1;background:var(--mumu);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;font-family:var(--en)">'+mPct+'%</div>' +
      '</div>' +
      '<div style="display:flex;gap:16px;font-size:12.5px">' +
        '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--wooly);display:inline-block"></span>'+o1+' '+fm(W.rev)+'</span>' +
        '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--mumu);display:inline-block"></span>'+o2+' '+fm(M.rev)+'</span>' +

            : splitMode==='equal'
            ? '<td class="tn" style="color:var(--gold);font-weight:600">'+fm(Math.round(r.rev/2))+'</td>'
            : '<td><div style="display:flex;align-items:center;gap:6px">' +
                '<div style="width:60px;height:4px;background:var(--p2);border-radius:3px">' +

      ).join('') +
      '</tbody></table></div></div>';
};

PF.members = function() {
  const addBtn = document.createElement('button');
  addBtn.className='btn btn-p'; addBtn.innerHTML=IC.plus+' 新增會員';
  addBtn.addEventListener('click', () => openMbrModal(null));
  ge('tb-act').innerHTML=''; ge('tb-act').appendChild(addBtn);

  const rr = getReturnRate();
  const none = members.filter(m=>getMemberOrders(m.id).length===0).length;
  const once = members.filter(m=>getMemberOrders(m.id).length===1).length;
  const multi = members.filter(m=>getMemberOrders(m.id).length>1).length;
  const t = members.length;
  const wNone = t ? Math.round(none/t*100) : 0;
  const wOnce = t ? Math.round(once/t*100) : 0;
  const wMulti = 100 - wNone - wOnce;

  // overdue members
  const overdueList = members.filter(m => {
    const avg = getAvgInterval(m.id);
    if (avg===null) return false;
    return getDaysSince(getMemberOrders(m.id)[0]?.date||today()) > avg*1.5;
  });

  const statCards = [
    {lbl:'會員總數',val:t,sub:'名'},
    {lbl:'回頭率',val:rr+'%',sub:'消費超過1次'},
    ...tierConfig.map(tc=>({lbl:tc.name,val:members.filter(m=>m.tier===tc.id).length,sub:'人'}))
  ];

  ge('pg').innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:13px;margin-bottom:20px">' +
      statCards.map(s=>'<div class="sc"><div class="sc-acc"></div><div class="sc-lbl">'+s.lbl+'</div><div class="sc-val">'+s.val+'</div><div class="sc-sub">'+s.sub+'</div></div>').join('') +
    '</div>' +
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-hd"><span class="card-ttl">回頭率概覽</span></div>' +
      '<div style="padding:16px 20px">' +
        '<div style="display:flex;border-radius:6px;overflow:hidden;margin-bottom:10px;height:10px">' +
          '<div style="width:'+wNone+'%;background:#ddd;min-width:'+(none>0?4:0)+'px" title="從未消費"></div>' +
          '<div style="width:'+wOnce+'%;background:#c17f3e;min-width:'+(once>0?4:0)+'px" title="僅消費1次"></div>' +
          '<div style="flex:1;background:var(--cr);min-width:'+(multi>0?4:0)+'px" title="回頭消費"></div>' +
        '</div>' +
        '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px">' +
          [['#ddd','從未消費',none],['#c17f3e','僅1次',once],['var(--cr)','回頭消費',multi]].map(([c,l,v])=>
            '<span style="display:flex;align-items:center;gap:5px;font-size:12.5px"><span style="width:10px;height:10px;border-radius:50%;background:'+c+';display:inline-block"></span>'+l+'：<strong style="font-family:var(--en)">'+v+'</strong> 人</span>'
          ).join('') +
        '</div>' +
        (overdueList.length > 0 ?
          '<div class="alw alw-y" style="margin-bottom:0">' + IC.warn + '<div><strong>逾期未回購：</strong>' + overdueList.map(m=>m.name).join('、') + ' 已超過平均回購週期</div></div>'
        : '') +
      '</div>' +
    '</div>' +
    '<div id="mbr-wrap">' +
      '<div class="bulk-bar">' +
        '<input type="checkbox" class="hdr-cb" title="全選">' +
        '<span style="font-size:13px">已選取 <span class="bulk-cnt">0</span> 名</span>' +
        '<button class="btn btn-sm bulk-sel-all" style="background:rgba(255,255,255,.12);color:var(--p);border-color:rgba(255,255,255,.2)">全選</button>' +
        '<button class="btn btn-sm bulk-desel-all" style="background:rgba(255,255,255,.12);color:var(--p);border-color:rgba(255,255,255,.2)">取消</button>' +
        '<button class="btn btn-sm bulk-del-btn" disabled style="background:#b71c1c;color:#fff;border-color:#b71c1c;margin-left:auto">🗑 刪除選取</button>' +
      '</div>' +
      '<div class="card" style="border-top:none;border-radius:0 0 var(--r2) var(--r2)"><div class="tw"><table>' +
        '<thead><tr><th class="cb-th"></th><th>姓名</th><th>手機</th><th>等級</th><th>點數</th><th>總消費</th><th>距升等</th><th>加入日期</th><th>操作</th></tr></thead>' +
        '<tbody id="mbr-tbody"></tbody>' +
      '</table></div></div>' +
    '</div>';

  renderMbrTable();
};

function renderMbrTable() {
  const tb = ge('mbr-tbody'); if (!tb) return;
  tb.innerHTML = members.map(m => {
    const sorted = [...tierConfig].sort((a,b)=>a.minSpend-b.minSpend);
    const next = sorted.find(x=>x.minSpend>m.totalSpend);
    const mOrds = getMemberOrders(m.id);
    const avg = getAvgInterval(m.id);
    const overdue = avg !== null && getDaysSince(mOrds[0]?.date||today()) > avg*1.5;
    return '<tr>' +
      '<td class="cb-td"><input type="checkbox" class="row-cb" data-id="' + m.id + '"></td>' +
      
      '<td style="font-weight:600;white-space:nowrap;min-width:80px">' + m.name + (overdue?'<span class="bdg br" style="margin-left:5px;font-size:9px">逾期</span>':'') + '</td>' +
      '<td class="tn" style="white-space:nowrap">' + m.phone + '</td>' +
      '<td>' + tierBadge(m.tier) + '</td>' +
      '<td><span style="font-family:var(--en);font-weight:700;color:var(--gold)">' + m.points.toLocaleString() + '</span> <span style="font-size:10.5px;color:var(--txt3)">pt</span></td>' +
      '<td class="tn" style="font-weight:600">' + fm(m.totalSpend) + '</td>' +
      '<td style="font-size:11px;color:var(--txt3);white-space:nowrap">' + (next?fm(next.minSpend-m.totalSpend):'已最高') + '</td>' +
      
      '<td class="hide-mob" style="font-size:11px;white-space:nowrap;color:var(--txt3)">' + m.joined + '</td>' +
      '<td style="white-space:nowrap"><div style="display:flex;gap:3px;flex-wrap:nowrap">' +
        '<button class="btn btn-o btn-sm mbr-hist" data-id="' + m.id + '" title="消費紀錄">' + IC.history + '</button>' +
        '<button class="btn btn-o btn-sm mbr-edit" data-id="' + m.id + '">編輯</button>' +
        '<button class="btn btn-p btn-sm mbr-pos" data-id="' + m.id + '" title="帶入收銀台">' + IC.cart + '</button>' +
        '<button class="btn btn-d btn-sm mbr-del" data-id="' + m.id + '">' + IC.trash + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  tb.querySelectorAll('.mbr-hist').forEach(b => b.addEventListener('click', () => openMbrHistoryModal(b.dataset.id)));
  tb.querySelectorAll('.mbr-edit').forEach(b => b.addEventListener('click', () => openMbrModal(b.dataset.id)));
  tb.querySelectorAll('.mbr-pos').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
    document.querySelector('[data-page="pos"]').classList.add('on');
    ge('pg-title').textContent = '結帳收銀';
    loadMemberToCart(b.dataset.id);
  }));
  tb.querySelectorAll('.mbr-del').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('確定刪除此會員？')) return;
    const delId = b.dataset.id;
    members = members.filter(m => m.id!==delId);
    saveToLocal();
    if (fbReady) { try { await deleteDocFromFB('members', delId); } catch(e) { console.warn(e); } }
    PF.members();
  }));

  // bulk select
  makeBulkBar('mbr-wrap',
    () => members.map(m => m.id),
    ids => { members = members.filter(m => !ids.includes(m.id)); },
    () => PF.members(),
    'members'
  );
}

function openMbrHistoryModal(mid) {
  const m = members.find(x=>x.id===mid); if (!m) return;
  const mOrds = getMemberOrders(mid);
  const avgSpend = mOrds.length ? Math.round(m.totalSpend/mOrds.length) : 0;
  const lastDate = mOrds.length ? mOrds[0].date : null;
  const daysSince = lastDate ? getDaysSince(lastDate) : null;
  const avgInt = getAvgInterval(mid);
  const isOverdue = avgInt!==null && daysSince!==null && daysSince>avgInt*1.5;

  const ov = document.createElement('div'); ov.className='ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:660px">' +
      '<div class="mhd"><div class="mttl">' + IC.history + ' ' + m.name + ' 的消費紀錄</div><button class="btn-g" id="mh-x">' + IC.x + '</button></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1.5px solid var(--p3)">' +
        [
          {lbl:'消費次數',val:mOrds.length+'次'},
          {lbl:'總消費金額',val:fm(m.totalSpend)},
          {lbl:'平均客單價',val:mOrds.length?fm(avgSpend):'—'},
          {lbl:'上次到訪',val:(lastDate||'未消費')+(daysSince!==null?'<div style="font-size:11px;color:var(--txt3)">'+daysSince+' 天前</div>':'')},
        ].map((s,i)=>'<div style="padding:15px;'+(i<3?'border-right:1px solid var(--p3)':'')+'">' +
          '<div style="font-size:11px;font-weight:500;color:var(--txt3);margin-bottom:4px">'+s.lbl+'</div>' +
          '<div style="font-family:var(--en);font-weight:700;font-size:17px;color:var(--ink)">'+s.val+'</div>' +
        '</div>').join('') +
      '</div>' +
      (avgInt!==null ?
        '<div style="padding:10px 18px;background:'+(isOverdue?'#fff8e6':'#e9f5ea')+';border-bottom:1px solid var(--p3);font-size:12.5px;color:'+(isOverdue?'#7a5800':'#1e6b2e')+'">' +
          '平均每 <strong style="font-family:var(--en)">' + avgInt + '</strong> 天回購一次 · ' +
          (isOverdue ? '<strong>已超過平均回購週期，建議關心</strong>' : '回購週期正常') +
        '</div>' : '') +
      '<div style="max-height:360px;overflow-y:auto">' +
        (mOrds.length===0 ?
          '<div style="padding:32px;text-align:center;color:var(--txt3);font-size:13px">尚無消費紀錄</div>' :
          mOrds.map(o=>
            '<div style="padding:12px 18px;border-bottom:1px solid var(--p2)">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
                '<div style="display:flex;align-items:center;gap:8px">' +
                  '<span style="font-family:var(--en);font-size:11px;color:var(--txt3)">' + o.id + '</span>' +
                  '<span style="font-size:12px;color:var(--txt3)">' + o.date + '</span>' +
                  '<span class="bdg bb" style="font-size:10px">' + o.payment + '</span>' +
                  (o.status==='部分退款' ? '<span class="bdg br" style="font-size:10px">部分退款</span>' : '') +
                '</div>' +
                '<span style="font-family:var(--en);font-weight:700;font-size:15px;color:var(--cr)">' + fm(o.total) + '</span>' +
              '</div>' +
              '<div style="display:flex;flex-wrap:wrap;gap:5px">' +
                o.items.map(it => {
                  const refQty = it.refundedQty || (it.refunded ? it.qty : 0);
                  const allRefunded = refQty >= it.qty;
                  return '<span style="font-size:11.5px;background:var(--p2);border-radius:4px;padding:2px 8px;color:var(--txt2);' +
                    (allRefunded ? 'text-decoration:line-through;opacity:.55' : '') + '">' +
                    ownerTag(it.owner) + ' ' + it.name + ' ×' + it.qty +
                    (refQty>0 && !allRefunded ? '<span style="color:var(--cr);font-weight:600;margin-left:3px">（已退' + refQty + '）</span>' : '') +
                  '</span>';
                }).join('') +
              '</div>' +
            '</div>'
          ).join('')) +
      '</div>' +
      '<div class="mft">' +
        '<button class="btn btn-o" id="mh-close">關閉</button>' +
        '<button class="btn btn-p" id="mh-pos">帶入收銀台</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#mh-x').addEventListener('click', close);
  ov.querySelector('#mh-close').addEventListener('click', close);
  ov.querySelector('#mh-pos').addEventListener('click', () => {
    close();
    document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
    document.querySelector('[data-page="pos"]').classList.add('on');
    ge('pg-title').textContent = '結帳收銀';
    loadMemberToCart(mid);
  });
}

function openMbrModal(id, prefillPhone, onSaved) {
  const m = id ? members.find(x=>x.id===id) : null;
  const ov = document.createElement('div'); ov.className='ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:440px">' +
      '<div class="mhd"><div class="mttl">' + (m?'編輯會員':'新增會員') + '</div><button class="btn-g" id="mm-x">' + IC.x + '</button></div>' +
      '<div class="mbd"><div class="g2">' +
        '<div class="fg"><label>姓名</label><input class="fi" id="mf-nm" value="' + (m?.name||'') + '"></div>' +
        '<div class="fg"><label>手機號碼 <span style="font-size:11px;color:var(--txt3);font-weight:400">（09 開頭 10 碼）</span></label><input class="fi" id="mf-ph" value="' + (m?.phone||prefillPhone||'') + '" placeholder="例：0912345678" maxlength="12" inputmode="numeric"></div>' +
        '<div class="fg"><label>累積點數</label><input class="fi" type="number" id="mf-pt" value="' + (m?.points||0) + '"></div>' +
        '<div class="fg"><label>累計消費（元）</label><input class="fi" type="number" id="mf-sp" value="' + (m?.totalSpend||0) + '"></div>' +
      '</div>' +
      '<div class="fg"><label>小寵備註</label><input class="fi" id="mf-nt" value="' + (m?.note||'') + '" placeholder="例：飼養三線鼠、對特定草圈過敏"></div>' +
      '</div>' +
      '<div class="mft"><button class="btn btn-o" id="mm-cancel">取消</button><button class="btn btn-p" id="mm-save">' + IC.check + ' 儲存</button></div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#mm-x').addEventListener('click', close);
  ov.querySelector('#mm-cancel').addEventListener('click', close);
  ov.querySelector('#mm-save').addEventListener('click', () => {
    const name=ge('mf-nm').value.trim(), phone=normPhone(ge('mf-ph').value);
    if (!name||!phone) { alert('請填寫姓名與手機'); return; }
    if (!isValidPhone(phone)) { alert('手機號碼格式錯誤\n請輸入 09 開頭共 10 碼\n（例：0912345678）'); return; }
    const dupPhone = members.find(x => normPhone(x.phone)===phone && x.id!==(id||''));
    if (dupPhone) { alert('此手機號碼已有會員「' + dupPhone.name + '」，請確認是否重複登錄'); return; }
    const spend=+ge('mf-sp').value||0;
    const pts=+ge('mf-pt').value||0;
    const data={name,phone,points:pts,totalSpend:spend,note:ge('mf-nt').value.trim(),tier:getTierIdBySpend(spend),joined:m?.joined||today()};
    let saved;
    if (id) { const i=members.findIndex(x=>x.id===id); members[i]={...members[i],...data}; saved=members[i]; }
    else { saved={id:'M'+Date.now(),...data}; members.push(saved); }
    close(); saveToLocal();
    if (onSaved) onSaved(saved); else PF.members();
  });
}

function renderTierCards() {

      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">' +
        '<div class="fg" style="margin:0"><label>等級名稱</label><input class="fi tier-nm" data-tid="'+t.id+'" value="'+t.name+'"></div>' +
        '<div class="fg" style="margin:0"><label>最低累計消費（元）</label><input class="fi tier-ms" type="number" data-tid="'+t.id+'" value="'+t.minSpend+'"'+(i===0?' readonly style="background:var(--p2);cursor:not-allowed"':'')+'>'+
        '</div>' +
        '<div class="fg" style="margin:0"><label>自動折扣（%）</label><input class="fi tier-dp" type="number" min="0" max="50" data-tid="'+t.id+'" value="'+t.discPct+'"></div>' +
      '</div>' +

        '<div class="fg" style="margin:0"><label>文字顏色</label><div style="display:flex;gap:6px;align-items:center"><input type="color" class="tier-col" data-tid="'+t.id+'" value="'+t.color+'" style="width:36px;height:34px;border:1.5px solid var(--p3);border-radius:6px;cursor:pointer;padding:2px"><input class="fi tier-col-hex" data-tid="'+t.id+'" value="'+t.color+'" style="font-family:var(--en);font-size:12px"></div></div>' +
        '<div class="fg" style="margin:0"><label>背景顏色</label><div style="display:flex;gap:6px;align-items:center"><input type="color" class="tier-bg" data-tid="'+t.id+'" value="'+t.bg+'" style="width:36px;height:34px;border:1.5px solid var(--p3);border-radius:6px;cursor:pointer;padding:2px"><input class="fi tier-bg-hex" data-tid="'+t.id+'" value="'+t.bg+'" style="font-family:var(--en);font-size:12px"></div></div>' +

          (i===0?'所有人預設等級，無消費下限':'累計消費滿 '+fm(t.minSpend)+' 升等') +

  ).join('');

  const bindInput = (cls, field) => {
    wrap.querySelectorAll('.' + cls).forEach(el => el.addEventListener('input', function() {
      const t = tierConfig.find(x => x.id == this.dataset.tid); if (!t) return;
      t[field] = field==='minSpend'||field==='discPct' ? (+this.value||0) : this.value;
      // sync color picker + hex
      if (field==='color') { const cp=wrap.querySelector('.tier-col[data-tid="'+this.dataset.tid+'"]'); if(cp)cp.value=this.value; updateCardStyle(this.dataset.tid,wrap); }
      if (field==='colhex') { t.color=this.value; const cp=wrap.querySelector('.tier-col[data-tid="'+this.dataset.tid+'"]'); if(cp)cp.value=this.value; updateCardStyle(this.dataset.tid,wrap); }
      if (field==='bg') { const bh=wrap.querySelector('.tier-bg-hex[data-tid="'+this.dataset.tid+'"]'); if(bh)bh.value=this.value; updateCardStyle(this.dataset.tid,wrap); }
      if (field==='bghex') { t.bg=this.value; const cp=wrap.querySelector('.tier-bg[data-tid="'+this.dataset.tid+'"]'); if(cp)cp.value=this.value; updateCardStyle(this.dataset.tid,wrap); }
      if (field==='border') { const bh=wrap.querySelector('.tier-bd-hex[data-tid="'+this.dataset.tid+'"]'); if(bh)bh.value=this.value; updateCardStyle(this.dataset.tid,wrap); }
      if (field==='borhex') { t.border=this.value; const cp=wrap.querySelector('.tier-bd[data-tid="'+this.dataset.tid+'"]'); if(cp)cp.value=this.value; updateCardStyle(this.dataset.tid,wrap); }
      if (field==='name') { const badge=wrap.querySelector('.tier-card[data-tid="'+this.dataset.tid+'"] .bdg'); if(badge)badge.textContent=this.value; }
    }));
  };
  bindInput('tier-nm','name');
  bindInput('tier-ms','minSpend');
  bindInput('tier-dp','discPct');
  bindInput('tier-col','color');
  bindInput('tier-col-hex','colhex');
  bindInput('tier-bg','bg');
  bindInput('tier-bg-hex','bghex');
  bindInput('tier-bd','border');
  bindInput('tier-bd-hex','borhex');

  wrap.querySelectorAll('.tier-save').forEach(b => b.addEventListener('click', () => {
    members.forEach(m => { m.tier = getTierIdBySpend(m.totalSpend); });
    saveToLocal();
    showToast('等級設定已儲存，已重算所有會員等級');
    renderTierCards();
  }));
  wrap.querySelectorAll('.tier-del').forEach(b => b.addEventListener('click', () => {
    if (!confirm('確定刪除此等級？')) return;
    tierConfig = tierConfig.filter(x => x.id != b.dataset.tid);
    members.forEach(m => { if (m.tier == b.dataset.tid) m.tier = 0; });
    saveToLocal();
    renderTierCards();
  }));
}

function updateCardStyle(tid, wrap) {
  const t = tierConfig.find(x => x.id == tid); if (!t) return;
  const card = wrap.querySelector('.tier-card[data-tid="'+tid+'"]'); if (!card) return;
  card.style.background = t.bg; card.style.borderColor = t.border;
  const badge = card.querySelector('.bdg');
  if (badge) { badge.style.background=t.bg; badge.style.color=t.color; badge.style.borderColor=t.border; }
}

function parseSellShipFile(file) {
  showToast('正在解析 Excel 檔案...');
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      if (typeof XLSX === 'undefined') {
        showToast('試算表套件尚未載入，請稍後再試');
        return;
      }
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      // Try '非訂單匯入' sheet first, fallback to '訂單匯入', then first sheet
      let sheetName = wb.SheetNames.includes('非訂單匯入') ? '非訂單匯入'
                    : wb.SheetNames.includes('訂單匯入')   ? '訂單匯入'
                    : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      // Convert to array of arrays
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      parseSellShipRows(rows);
    } catch(err) {
      showToast('解析失敗：' + err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseSellShipRows(rows) {
  // Find header row (has 訂單編號)
  let headerIdx = -1;
  let headers = [];
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const row = rows[i];
    if (row && row.some(v => v && String(v).includes('訂單編號'))) {
      headerIdx = i;
      headers = row.map(v => v ? String(v).replace(/\n/g,'').trim() : '');
      break;
    }
  }
  if (headerIdx < 0) { showToast('找不到標題列，請確認是賣貨便匯出格式'); return; }

  // Column indices
  const COL = {
    shopType: headers.indexOf('賣場類型'),
    shopName: Math.max(headers.indexOf('賣場名稱'), headers.indexOf('賣場名稱')),
    date:     headers.indexOf('訂購日期'),
    orderId:  headers.indexOf('訂單編號'),
    status:   headers.indexOf('狀態'),
    buyer:    headers.indexOf('收件人姓名'),
    payment:  headers.indexOf('付款方式'),
    itemName: Math.max(headers.findIndex(h => h.includes('商品名稱')), 0),
    unitPrice:headers.indexOf('單價'),
    qty:      headers.indexOf('數量'),
    subtotal: headers.findIndex(h => h.includes('小計')),
    shipping: headers.findIndex(h => h.includes('運費')),
    total:    headers.findIndex(h => h.includes('商品總額')),
  };

  // Parse data rows
  const ordersMap = {};
  let curOrder = null;
  let imported = 0, skipped = 0;

  function cellStr(v) { return v != null ? String(v).replace(/\n/g,' ').trim() : ''; }
  function cellNum(v) { return parseFloat(String(v||0).replace(/,/g,'')) || 0; }
  function parseDate(v) {
    if (!v) return '';
    const s = String(v);
    // Excel date number
    if (/^\d+$/.test(s)) {
      const d = new Date(Math.round((+s - 25569) * 86400 * 1000));
      return d.toISOString().slice(0,10);
    }
    // 2026/07/26 or 2026-07-26
    return s.replace(/\//g,'-').slice(0,10);
  }

  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(v => v == null)) continue;

    const orderId = cellStr(row[COL.orderId]);
    const status  = cellStr(row[COL.status]).split('(')[0].trim();

    // Skip cancelled orders
    if (status.includes('取消')) { skipped++; continue; }

    if (orderId && orderId.startsWith('CM')) {
      // New order row
      const shopName = cellStr(row[Math.max(COL.shopName,1)]);
      curOrder = {
        id: 'SS-' + orderId,
        sourceId: orderId,
        date: parseDate(row[COL.date]),
        shopName: shopName,
        buyer: cellStr(row[COL.buyer]),
        payment: cellStr(row[COL.payment]).split('\n')[0].trim(),
        status: status,
        items: [],
        subtotal: cellNum(row[COL.subtotal]),
        shipping: cellNum(row[COL.shipping]),
        total:    cellNum(row[COL.total]) || cellNum(row[COL.subtotal]),
        netRevenue: (() => {
          const tot = cellNum(row[COL.total]) || cellNum(row[COL.subtotal]);
          return tot - 38;
        })(),
        source: '賣貨便',
      };
      ordersMap[orderId] = curOrder;
      imported++;
    }

    // Add item (works for both main row and continuation rows)
    if (curOrder) {
      const itemName = cellStr(row[COL.itemName]);
      const qty   = parseInt(row[COL.qty]) || 0;
      const price = cellNum(row[COL.unitPrice]);
      if (itemName) {
        curOrder.items.push({ name: itemName, qty, price });
      }
    }
  }

  const newOrders = Object.values(ordersMap);
  
  if (newOrders.length === 0) {
    showToast('未找到有效訂單');
    return;
  }

  // Show preview
  const preview = ge('ss-preview');
  if (preview) {
    preview.style.display = 'block';
    const valid = newOrders.filter(o => !o.status.includes('取消'));
    const totalRev = valid.reduce((s,o) => s + (o.netRevenue != null ? o.netRevenue : (o.total || o.subtotal)), 0);
    preview.innerHTML =
      '<div style="background:var(--p2);border-radius:var(--r);padding:14px 16px;margin-bottom:12px">' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">' +
          '<div><div style="font-size:11px;color:var(--txt3)">找到訂單</div><div style="font-family:var(--en);font-size:22px;font-weight:700;color:var(--ink)">' + newOrders.length + '</div></div>' +
          '<div><div style="font-size:11px;color:var(--txt3)">實收金額合計</div><div style="font-family:var(--en);font-size:22px;font-weight:700;color:var(--cr)">' + fm(totalRev) + '</div></div>' +
          '<div><div style="font-size:11px;color:var(--txt3)">已略過（取消）</div><div style="font-family:var(--en);font-size:22px;font-weight:700;color:var(--txt3)">' + skipped + '</div></div>' +
        '<div style="font-size:11px;color:var(--txt3);margin-top:8px">⚠ 實收 = 商品總額 − $38 × 訂單數（每筆訂單均扣除運費成本）</div>' +
        '</div>' +
      '</div>' +
      '<div style="max-height:240px;overflow-y:auto;border:1.5px solid var(--p3);border-radius:var(--r);margin-bottom:12px">' +
        '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
          '<thead><tr style="background:var(--p);border-bottom:2px solid var(--cr)"><th style="padding:8px 12px;text-align:left;color:var(--cr);font-size:11px">訂單編號</th><th style="padding:8px 12px;text-align:left;color:var(--cr);font-size:11px">日期</th><th style="padding:8px 12px;text-align:left;color:var(--cr);font-size:11px">賣場</th><th style="padding:8px 12px;text-align:left;color:var(--cr);font-size:11px">買家</th><th style="padding:8px 12px;text-align:left;color:var(--cr);font-size:11px">狀態</th><th style="padding:8px 12px;text-align:right;color:var(--cr);font-size:11px">小計</th></tr></thead>' +
          '<tbody>' +
            newOrders.map(o =>
              '<tr style="border-bottom:1px solid var(--p2)">' +
                '<td style="padding:7px 12px;font-family:var(--en);font-size:11px;color:var(--txt3)">' + o.sourceId + '</td>' +
                '<td style="padding:7px 12px">' + o.date + '</td>' +
                '<td style="padding:7px 12px;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + o.shopName + '</td>' +
                '<td style="padding:7px 12px">' + o.buyer + '</td>' +
                '<td style="padding:7px 12px"><span class="bdg ' + (o.status.includes('已取件')?'bg':o.status.includes('已送達')?'bb':o.status.includes('訂單成立')?'ba':'bi') + '" style="font-size:10px">' + o.status + '</span></td>' +
                '<td style="padding:7px 12px;font-family:var(--en);font-weight:600;text-align:right">' + fm(o.netRevenue != null ? o.netRevenue : (o.total || o.subtotal)) + '</td>' +
              '</tr>'
            ).join('') +
          '</tbody>' +
        '</table>' +
      '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-p" id="ss-import-confirm">確認匯入 ' + newOrders.length + ' 筆</button>' +
        '<button class="btn btn-o" id="ss-import-cancel">取消</button>' +
      '</div>';

    ge('ss-import-confirm').addEventListener('click', () => {
      // Merge: skip duplicates by sourceId
      const existingIds = new Set(externalOrders.map(o => o.sourceId));
      const toAdd = newOrders.filter(o => !existingIds.has(o.sourceId));
      externalOrders = [...externalOrders, ...toAdd];
      saveToLocal();
      showToast('已匯入 ' + toAdd.length + ' 筆賣貨便訂單' + (toAdd.length < newOrders.length ? '（' + (newOrders.length - toAdd.length) + ' 筆重複略過）' : ''));
      PF.sellship();
    });

    ge('ss-import-cancel').addEventListener('click', () => {
      preview.style.display = 'none';
    });
  }
}

function renderSellShipReport() {
  if (!externalOrders.length) {
    return '<div style="text-align:center;padding:32px;color:var(--txt3);font-size:13px">尚未匯入任何賣貨便訂單<br><span style="font-size:11px">匯入後將顯示月結匯總</span></div>';
  }

  // 只有「整筆全額退款」才不算營收；「部分退款」訂單的 o.total 已經是退款後的剩餘金額，應該照樣計入月結
  const posOrders = orders.filter(o => o.status === '完成' || o.status === '部分退款');
  const extOrders = externalOrders;

  // Group by month
  const months = {};
  [...posOrders.map(o=>({...o, _src:'門市'})), ...extOrders.map(o=>({...o, _src:'賣貨便'}))].forEach(o => {
    const m = (o.date||'').slice(0,7);
    if (!m) return;
    if (!months[m]) months[m] = {pos:0,ext:0,extGross:0,extShipping:0,posCount:0,extCount:0};
    if (o._src==='門市') { months[m].pos += o.total||0; months[m].posCount++; }
    else {
      const gross = o.total || o.subtotal || 0;
      const net   = o.netRevenue != null ? o.netRevenue : gross - 38;
      months[m].extGross    += gross;
      months[m].extShipping += 38;
      months[m].ext         += net;
      months[m].extCount++;
    }
  });

  const sortedMonths = Object.keys(months).sort().reverse();
  
  if (!sortedMonths.length) return '<div style="padding:20px;color:var(--txt3)">無資料</div>';

  // Shop name breakdown for external orders
  const shopBreak = {};
  extOrders.forEach(o => {
    const shop = o.shopName || '未知賣場';
    if (!shopBreak[shop]) shopBreak[shop] = {count:0, total:0};
    shopBreak[shop].count++;
    shopBreak[shop].total += (o.netRevenue != null ? o.netRevenue : (o.total || o.subtotal)) || 0;
  });

  return sortedMonths.map(m => {
    const d = months[m];
    const grandTotal = d.pos + d.ext; // ext is already net (after shipping deduction)
    const extPct = grandTotal ? Math.round(d.ext/grandTotal*100) : 0;
    const posPct = 100 - extPct;
    return (
      '<div style="margin-bottom:24px">' +
        '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--cr)">' + m + ' 月結匯總</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">' +
          '<div class="sc" style="padding:14px"><div class="sc-acc"></div><div class="sc-lbl">門市營業額</div><div class="sc-val">' + fm(d.pos) + '</div><div class="sc-sub">' + d.posCount + ' 筆訂單</div></div>' +
          '<div class="sc" style="padding:14px"><div class="sc-acc" style="background:var(--mumu)"></div><div class="sc-lbl">賣貨便商品總額</div><div class="sc-val">' + fm(d.extGross) + '</div><div class="sc-sub">' + d.extCount + ' 筆訂單</div></div>' +
          '<div class="sc" style="padding:14px"><div class="sc-acc" style="background:#e57373"></div><div class="sc-lbl">運費成本</div><div class="sc-val" style="color:#b71c1c">−' + fm(d.extShipping) + '</div><div class="sc-sub">' + d.extCount + ' 筆 × $38</div></div>' +
          '<div class="sc" style="padding:14px"><div class="sc-acc" style="background:var(--gold)"></div><div class="sc-lbl">實際獲利</div><div class="sc-val" style="color:var(--cr)">' + fm(grandTotal) + '</div><div class="sc-sub">門市 + 賣貨便淨收</div></div>' +
        '</div>' +
        '<div style="margin-bottom:10px">' +
          '<div style="font-size:11px;color:var(--txt3);margin-bottom:5px">通路佔比</div>' +
          '<div style="display:flex;height:10px;border-radius:6px;overflow:hidden">' +
            '<div style="width:' + posPct + '%;background:var(--cr)" title="門市 ' + posPct + '%"></div>' +
            '<div style="flex:1;background:var(--mumu)" title="賣貨便 ' + extPct + '%"></div>' +
          '</div>' +
          '<div style="display:flex;gap:16px;margin-top:6px;font-size:11.5px">' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--cr);display:inline-block"></span>門市 ' + posPct + '%</span>' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--mumu);display:inline-block"></span>賣貨便 ' + extPct + '%</span>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('') +
  (Object.keys(shopBreak).length > 0 ?
    '<div style="margin-top:4px"><div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px">賣場別明細（全期）</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
        '<thead><tr style="background:var(--p);border-bottom:2px solid var(--cr)"><th style="padding:8px 13px;text-align:left;color:var(--cr);font-size:11px">賣場名稱</th><th style="padding:8px 13px;text-align:left;color:var(--cr);font-size:11px">訂單數</th><th style="padding:8px 13px;text-align:right;color:var(--cr);font-size:11px">商品小計</th></tr></thead>' +
        '<tbody>' +
          Object.entries(shopBreak).sort((a,b)=>b[1].total-a[1].total).map(([shop,d]) =>
            '<tr style="border-bottom:1px solid var(--p2)"><td style="padding:9px 13px;font-weight:500">' + shop + '</td><td style="padding:9px 13px;font-family:var(--en)">' + d.count + '</td><td style="padding:9px 13px;font-family:var(--en);font-weight:600;text-align:right">' + fm(d.total) + '</td></tr>'
          ).join('') +
        '</tbody>' +
      '</table>' +
    '</div>'
  : '');
}

function exportSellShipCSV() {
  if (typeof XLSX === 'undefined') { showToast('試算表套件尚未載入，請稍後再試'); return; }
  const posOrders = orders.filter(o => o.status === '完成' || o.status === '部分退款');
  const headers = ['來源','日期','訂單編號','客戶/買家','付款方式','商品金額','賣場名稱'];
  const allRows = [
    ...posOrders.map(o => ['門市', o.date, o.id, o.customer, o.payment, o.total, '']),
    ...externalOrders.map(o => ['賣貨便', o.date, o.sourceId, o.buyer, o.payment, (o.netRevenue != null ? o.netRevenue : (o.total || o.subtotal)), o.shopName]),
  ].sort((a,b) => b[1].localeCompare(a[1]));
  if (!allRows.length) { showToast('尚無資料可匯出'); return; }

  // 依月份分組，加月小計，最後加總計
  const aoa = [headers];
  const months = [...new Set(allRows.map(r => (r[1]||'').slice(0,7)))].sort().reverse();
  let grandTotal = 0;
  months.forEach(m => {
    const monthRows = allRows.filter(r => (r[1]||'').slice(0,7)===m);
    monthRows.forEach(r => aoa.push(r));
    const monthTotal = monthRows.reduce((s,r) => s + (Number(r[5])||0), 0);
    grandTotal += monthTotal;
    aoa.push(['','','','','',m+' 當月總計',monthTotal]);
    aoa.push([]);
  });
  aoa.push(['','','','','','全部總計',grandTotal]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:8},{wch:11},{wch:14},{wch:14},{wch:10},{wch:14},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '月結報表');
  XLSX.writeFile(wb, 'WM熊窩_月結報表_' + today() + '.xlsx');
}

          '<button class="btn btn-o" id="cl-cancel">取消</button>' +

      '</div>';
    document.body.appendChild(ov);

    ge('cl-x').addEventListener('click', close);
    ge('cl-cancel').addEventListener('click', close);
    ge('cl-confirm').addEventListener('click', async () => {
      // 清除 Firebase（強制清除，不管 fbReady 狀態）
      if (db) {
        try {
          showToast('正在清除雲端資料…');
          const cols = ['products','members','orders','employees','restockLog','config'];
          for (const col of cols) {
            const snap = await db.collection(col).get();
            if (!snap.empty) {
              const batch = db.batch();
              snap.docs.forEach(doc => batch.delete(doc.ref));
              await batch.commit();
            }
          }
          showToast('✅ 雲端資料已清除');
        } catch(e) {
          console.warn('FB clear error:', e);
          showToast('⚠ 雲端清除失敗：' + e.message);
        }
      } else {
        showToast('⚠ 未連上 Firebase，僅清除本機');
      }
      localStorage.clear();
      location.reload();
    });
  });

  ge('clear-fb-only-btn')?.addEventListener('click', async () => {
    const statusEl = ge('fb-clear-status');
    if (!db) {
      if (statusEl) statusEl.textContent = '❌ Firebase 未連線（離線模式）';
      return;
    }
    if (!confirm('確定要清除 Firebase 雲端所有資料嗎？')) return;
    if (statusEl) statusEl.textContent = '⏳ 正在連線 Firebase…';
    try {
      const cols = ['products','members','orders','employees','restockLog','config'];
      let total = 0;
      for (const col of cols) {
        if (statusEl) statusEl.textContent = '⏳ 清除 ' + col + '…';
        const snap = await db.collection(col).get();
        if (!snap.empty) {
          // Batch delete (max 500 per batch)
          let batch = db.batch();
          let count = 0;
          for (const doc of snap.docs) {
            batch.delete(doc.ref);
            count++;
            if (count === 500) {
              await batch.commit();
              batch = db.batch();
              count = 0;
            }
          }
          if (count > 0) await batch.commit();
          total += snap.size;
        }
      }
      if (statusEl) statusEl.textContent = '✅ 雲端已清除 ' + total + ' 筆資料！刷新頁面生效';
      // Reset local state too
      products = []; members = []; orders = []; employees = []; restockLog = [];
      saveToLocal();
      showToast('✅ Firebase 雲端已清除！');
    } catch(e) {
      console.error('FB clear error:', e);
      if (statusEl) statusEl.textContent = '❌ 清除失敗：' + e.message;
    }
  });

  ge('export-btn').addEventListener('click', exportBackup);

  ge('import-file').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    ge('import-filename').textContent = file.name;
    importBackup(file);
    this.value = '';
  });
};
