function renderSellShipReport() {
  if (!externalOrders.length) {
    return '<div style="text-align:center;padding:32px;color:var(--txt3);font-size:13px">尚未匯入任何賣貨便訂單<br><span style="font-size:11px">匯入後將顯示月結匯總</span></div>';
  }

  // 只有「整筆全額退款」才不算營收；「部分退款」訂單的 o.total 已經是退款後的剩餘金額，應該照樣計入月結
  const posOrders = orders.filter(o => o.status === '完成' || o.status === '部分退款');
  const extOrders = externalOrders;

  // Group by month
  const months = {};
  [...posOrders.map(o=>({...o, _src:'門市'})), ...extOrders.map(o=>({...o, _src:'賣貨便'}))].forEach(o => {
    const m = (o.date||'').slice(0,7);
    if (!m) return;
    if (!months[m]) months[m] = {pos:0,ext:0,extGross:0,extShipping:0,posCount:0,extCount:0};
    if (o._src==='門市') { months[m].pos += o.total||0; months[m].posCount++; }
    else {
      const gross = o.total || o.subtotal || 0;
      const net   = o.netRevenue != null ? o.netRevenue : gross - 38;
      months[m].extGross    += gross;
      months[m].extShipping += 38;
      months[m].ext         += net;
      months[m].extCount++;
    }
  });

  const sortedMonths = Object.keys(months).sort().reverse();
  
  if (!sortedMonths.length) return '<div style="padding:20px;color:var(--txt3)">無資料</div>';

  // Shop name breakdown for external orders
  const shopBreak = {};
  extOrders.forEach(o => {
    const shop = o.shopName || '未知賣場';
    if (!shopBreak[shop]) shopBreak[shop] = {count:0, total:0};
    shopBreak[shop].count++;
    shopBreak[shop].total += (o.netRevenue != null ? o.netRevenue : (o.total || o.subtotal)) || 0;
  });

  return sortedMonths.map(m => {
    const d = months[m];
    const grandTotal = d.pos + d.ext; // ext is already net (after shipping deduction)
    const extPct = grandTotal ? Math.round(d.ext/grandTotal*100) : 0;
    const posPct = 100 - extPct;
    return (
      '<div style="margin-bottom:24px">' +
        '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--cr)">' + m + ' 月結匯總</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">' +
          '<div class="sc" style="padding:14px"><div class="sc-acc"></div><div class="sc-lbl">門市營業額</div><div class="sc-val">' + fm(d.pos) + '</div><div class="sc-sub">' + d.posCount + ' 筆訂單</div></div>' +
          '<div class="sc" style="padding:14px"><div class="sc-acc" style="background:var(--mumu)"></div><div class="sc-lbl">賣貨便商品總額</div><div class="sc-val">' + fm(d.extGross) + '</div><div class="sc-sub">' + d.extCount + ' 筆訂單</div></div>' +
          '<div class="sc" style="padding:14px"><div class="sc-acc" style="background:#e57373"></div><div class="sc-lbl">運費成本</div><div class="sc-val" style="color:#b71c1c">−' + fm(d.extShipping) + '</div><div class="sc-sub">' + d.extCount + ' 筆 × $38</div></div>' +
          '<div class="sc" style="padding:14px"><div class="sc-acc" style="background:var(--gold)"></div><div class="sc-lbl">實際獲利</div><div class="sc-val" style="color:var(--cr)">' + fm(grandTotal) + '</div><div class="sc-sub">門市 + 賣貨便淨收</div></div>' +
        '</div>' +
        '<div style="margin-bottom:10px">' +
          '<div style="font-size:11px;color:var(--txt3);margin-bottom:5px">通路佔比</div>' +
          '<div style="display:flex;height:10px;border-radius:6px;overflow:hidden">' +
            '<div style="width:' + posPct + '%;background:var(--cr)" title="門市 ' + posPct + '%"></div>' +
            '<div style="flex:1;background:var(--mumu)" title="賣貨便 ' + extPct + '%"></div>' +
          '</div>' +
          '<div style="display:flex;gap:16px;margin-top:6px;font-size:11.5px">' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--cr);display:inline-block"></span>門市 ' + posPct + '%</span>' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--mumu);display:inline-block"></span>賣貨便 ' + extPct + '%</span>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('') +
  (Object.keys(shopBreak).length > 0 ?
    '<div style="margin-top:4px"><div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px">賣場別明細（全期）</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
        '<thead><tr style="background:var(--p);border-bottom:2px solid var(--cr)"><th style="padding:8px 13px;text-align:left;color:var(--cr);font-size:11px">賣場名稱</th><th style="padding:8px 13px;text-align:left;color:var(--cr);font-size:11px">訂單數</th><th style="padding:8px 13px;text-align:right;color:var(--cr);font-size:11px">商品小計</th></tr></thead>' +
        '<tbody>' +
          Object.entries(shopBreak).sort((a,b)=>b[1].total-a[1].total).map(([shop,d]) =>
            '<tr style="border-bottom:1px solid var(--p2)"><td style="padding:9px 13px;font-weight:500">' + shop + '</td><td style="padding:9px 13px;font-family:var(--en)">' + d.count + '</td><td style="padding:9px 13px;font-family:var(--en);font-weight:600;text-align:right">' + fm(d.total) + '</td></tr>'
          ).join('') +
        '</tbody>' +
      '</table>' +
    '</div>'
  : '');
}

function exportSellShipCSV() {
  if (typeof XLSX === 'undefined') { showToast('試算表套件尚未載入，請稍後再試'); return; }
  const posOrders = orders.filter(o => o.status === '完成' || o.status === '部分退款');
  const headers = ['來源','日期','訂單編號','客戶/買家','付款方式','商品金額','賣場名稱'];
  const allRows = [
    ...posOrders.map(o => ['門市', o.date, o.id, o.customer, o.payment, o.total, '']),
    ...externalOrders.map(o => ['賣貨便', o.date, o.sourceId, o.buyer, o.payment, (o.netRevenue != null ? o.netRevenue : (o.total || o.subtotal)), o.shopName]),
  ].sort((a,b) => b[1].localeCompare(a[1]));
  if (!allRows.length) { showToast('尚無資料可匯出'); return; }

  // 依月份分組，加月小計，最後加總計
  const aoa = [headers];
  const months = [...new Set(allRows.map(r => (r[1]||'').slice(0,7)))].sort().reverse();
  let grandTotal = 0;
  months.forEach(m => {
    const monthRows = allRows.filter(r => (r[1]||'').slice(0,7)===m);
    monthRows.forEach(r => aoa.push(r));
    const monthTotal = monthRows.reduce((s,r) => s + (Number(r[5])||0), 0);
    grandTotal += monthTotal;
    aoa.push(['','','','','',m+' 當月總計',monthTotal]);
    aoa.push([]);
  });
  aoa.push(['','','','','','全部總計',grandTotal]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:8},{wch:11},{wch:14},{wch:14},{wch:10},{wch:14},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '月結報表');
  XLSX.writeFile(wb, 'WM熊窩_月結報表_' + today() + '.xlsx');
}

        const snap = await db.collection(col).get();
        if (!snap.empty) {
          // Batch delete (max 500 per batch)
          let batch = db.batch();
          let count = 0;
          for (const doc of snap.docs) {
            batch.delete(doc.ref);
            count++;
            if (count === 500) {
              await batch.commit();
              batch = db.batch();
              count = 0;
            }
          }
          if (count > 0) await batch.commit();
          total += snap.size;
        }
      }
      if (statusEl) statusEl.textContent = '✅ 雲端已清除 ' + total + ' 筆資料！刷新頁面生效';
      // Reset local state too
      products = []; members = []; orders = []; employees = []; restockLog = []; preorders = [];
      saveToLocal();
      showToast('✅ Firebase 雲端已清除！');
    } catch(e) {
      console.error('FB clear error:', e);
      if (statusEl) statusEl.textContent = '❌ 清除失敗：' + e.message;
    }
  });

  ge('export-btn').addEventListener('click', exportBackup);

  ge('import-file').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    ge('import-filename').textContent = file.name;
    importBackup(file);
    this.value = '';
  });
};

// ══ LOCALSTORAGE PERSISTENCE ══

const STORAGE_KEY = 'woolybear_data_v1';

function saveToLocal() {
  try {
    const data = {
      products, members, orders, externalOrders, employees,
      tierConfig, shopConfig, restockLog, preorders,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.warn('儲存失敗:', e); }
  // 同步到 Firebase：只送出真正變動過的資料，並用防抖合併短時間內的多次編輯（大幅降低寫入用量）
  if (fbReady) scheduleSync();
}

function loadFromLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.products)   products   = data.products;
    if (data.members)    members    = data.members;
    if (data.orders)     orders     = data.orders;
    if (data.employees)  employees  = data.employees;
    if (data.tierConfig) tierConfig = data.tierConfig;
    if (data.preorders)  preorders  = data.preorders;
    if (data.shopConfig) {
      Object.assign(shopConfig, data.shopConfig);
      if (!shopConfig.pointsRate) shopConfig.pointsRate = 100;
      if (!shopConfig.redeemItems) shopConfig.redeemItems = [];
      if (!shopConfig.owners || shopConfig.owners.length < 2) shopConfig.owners = ['Wooly', 'MuMu'];
    }
    if (data.restockLog) restockLog = data.restockLog;
    restockLog.forEach(r => { if (!r.id) r.id = genId(); });
    products.forEach((p, i) => { if (p.sortOrder === undefined) p.sortOrder = i; });
    return data.savedAt || true;
  } catch(e) {
    console.warn('載入失敗:', e);
    return false;
  }
}


function exportBackup() {
  const data = {
    _version: '1.1',
    _app: 'WoolyBear POS',
    _exportedAt: new Date().toISOString(),
    products, members, orders, externalOrders, employees, tierConfig, shopConfig, restockLog, preorders,
  };
  const json = JSON.stringify(data, null, 2);
  const BOM  = '﻿';
  const blob = new Blob([BOM + json], {type: 'application/json;charset=utf-8'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'WoolyBear_備份_' + today() + '.json';
  a.click();
  showToast('備份已下載！請儲存到安全的地方');
}

function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let text = e.target.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const data = JSON.parse(text);

      // ── 格式驗證 ──
      if (!data._app || data._app !== 'WoolyBear POS') {
        alert('格式不符，請選擇正確的 WoolyBear POS 備份檔案');
        return;
      }

      // ── 版本比對：偵測缺少的新欄位 ──
      const CURRENT_VERSION = '3.0';
      const backupVersion   = data._version || '1.0';
      const exportedAt      = data._exportedAt ? localDateStr(new Date(data._exportedAt)) : '';
      const missing = [];
      if (!data.restockLog)              missing.push('進貨紀錄（restockLog）');
      if (!data.shopConfig?.redeemItems) missing.push('兌換獎勵清單（redeemItems）');
      if (!data.shopConfig?.pointsRate)  missing.push('點數折抵比率（pointsRate）');

      // ── 顯示確認 modal ──
      openImportConfirmModal({
        backupVersion,
        exportedAt,
        missing,
        onConfirm: () => {
          if (data.products)   products   = data.products;
          if (data.members)    members    = data.members;
          if (data.orders)     orders     = data.orders;
          if (data.employees)  employees  = data.employees;
          if (data.tierConfig) tierConfig = data.tierConfig;
          if (data.shopConfig) {
            Object.assign(shopConfig, data.shopConfig);
          }
          // ── 補齊缺少的新欄位 ──
          if (!shopConfig.pointsRate)  shopConfig.pointsRate  = 100;
          if (!shopConfig.redeemItems) shopConfig.redeemItems = [];
          if (data.restockLog) restockLog = data.restockLog;
          else restockLog = [];
          if (data.preorders) preorders = data.preorders;
          else preorders = [];
          saveToLocal();
          if (fbReady) {
            pushAllToFB().then(() => {
              // 還原是整批覆蓋，寫完後把這份內容標記為已同步基準，避免之後又被誤判成「變動過」重寫一次
              lastSyncedSnapshot = {
                products: sanitize(products), members: sanitize(members), orders: sanitize(orders),
                employees: sanitize(employees), restockLog: sanitize(restockLog), preorders: sanitize(preorders),
                shopConfig: sanitize(shopConfig), tierConfig: sanitize(tierConfig),
              };
              showToast('✅ 還原成功並同步至雲端（備份日期：' + exportedAt + '）');
            });
          } else {
            showToast('✅ 還原成功（備份日期：' + exportedAt + '）');
          }
          navigateTo('pos');
        }
      });
    } catch(err) {
      alert('還原失敗，檔案可能損毀：' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function openImportConfirmModal({ backupVersion, exportedAt, missing, onConfirm }) {
  const hasWarning = missing.length > 0;
  const ov = document.createElement('div'); ov.className = 'ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:440px">' +
      '<div class="mhd"><div class="mttl">📂 確認還原備份</div><button class="btn-g" id="ic-x">' + IC.x + '</button></div>' +
      '<div class="mbd" style="padding:18px 20px">' +
        '<div style="background:var(--p2);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:13px">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:4px">' +
            '<span style="color:var(--txt3)">備份日期</span><strong>' + (exportedAt||'不明') + '</strong>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between">' +
            '<span style="color:var(--txt3)">備份版本</span><span style="font-family:var(--en);font-weight:600">v' + backupVersion + '</span>' +
          '</div>' +
        '</div>' +
        (hasWarning
          ? '<div style="background:#fff8e6;border:1px solid #ffe08a;border-radius:var(--r);padding:12px 14px;margin-bottom:14px">' +
              '<div style="font-weight:700;font-size:12.5px;color:#7a5800;margin-bottom:6px">⚠ 此備份版本較舊，以下資料將重置為預設值：</div>' +
              missing.map(m => '<div style="font-size:12px;color:#7a5800;padding:2px 0 2px 10px">• ' + m + '</div>').join('') +
            '</div>'
          : '<div style="background:#e9f5ea;border:1px solid #b8dcb9;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#1e6b2e">✅ 備份版本完整，所有資料皆可還原。</div>') +
        '<div style="font-size:12.5px;color:#b71c1c;background:#fdecea;border:1px solid #f5c0bd;border-radius:var(--r);padding:10px 14px">⚠ 還原後，<strong>目前系統內的所有資料</strong>將被此備份取代，無法復原。</div>' +
      '</div>' +
      '<div class="mft">' +
        '<button class="btn btn-o" id="ic-cancel">取消</button>' +
        '<button class="btn btn-d" id="ic-confirm">確認還原</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ge('ic-x').addEventListener('click', close);
  ge('ic-cancel').addEventListener('click', close);
  ge('ic-confirm').addEventListener('click', () => { close(); onConfirm(); });
}

// Auto-save every 60 seconds + on page unload
setInterval(saveToLocal, 60000);
window.addEventListener('beforeunload', (e) => {
  saveToLocal();
  if (pendingFBWrites > 0) {
    e.preventDefault();
    e.returnValue = ''; // 觸發瀏覽器原生「確定要離開嗎」提示，避免同步未完成就被刷新蓋掉
    return '';
  }
});

// Wrap data-mutation functions to auto-save
const _origCheckout = doCheckout;

// ── Load on startup：Firebase 優先，本機只作離線備援 ──
(async () => {
  if (db) {
    // 有 Firebase → 直接從雲端載入，忽略本機快取
    try {
      showSyncStatus('連線中…');
      const loaded = await loadFromFB();
      startRealtimeSync();
      PF.pos();
      if (loaded) {
        setTimeout(() => showToast('☁ 資料已從雲端同步'), 500);
      } else {
        // Firebase 是空的 → 全新開始，清除本機舊資料
        localStorage.removeItem(STORAGE_KEY);
        PF.pos();
      }
    } catch(e) {
      console.warn('Firebase 連線失敗，切換離線模式:', e);
      // Firebase 失敗才用本機
      loadFromLocal();
      PF.pos();
      showSyncStatus('⚠ 離線模式');
    }
  } else {
    // 無 Firebase → 純離線模式
    loadFromLocal();
    PF.pos();
  }
})();
