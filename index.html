<!DOCTYPE html>
<html lang="zh-TW" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>熊窩研究所 POS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 主色：寶寶藍 */
  --cr:#7BB8D4;--cr2:#5FA0BE;--cr-lt:#EAF4FA;
  /* 背景：純白 + 極淡藍 */
  --p:#FBF8F2;--p2:#F5EFE6;--p3:#E8DDD0;
  /* 文字：暖棕灰（不要太深） */
  --ink:#5C4A3A;--w:#FFFDF8;--sb:240px;--tbh:56px;
  --txt:#5C4A3A;--txt2:#7A6A5A;--txt3:#B0A090;
  /* 點綴色 */
  --gold:#F5C842;
  --sh:0 2px 14px rgba(100,160,200,.12);--sh2:0 4px 24px rgba(100,160,200,.18);--sh3:0 8px 40px rgba(100,160,200,.22);
  --r:12px;--r2:20px;
  /* 闆娘色：粉紅 & 藍 */
  --wooly:#F2A8BC;--wooly-lt:#FEF0F4;
  --mumu:#7BB8D4;--mumu-lt:#EAF4FA;
  --zh:'Noto Sans TC',sans-serif;--en:'Nunito',sans-serif;
  --ease:.28s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--zh);color:var(--txt);font-size:14px;background:var(--p)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--p2)}
::-webkit-scrollbar-thumb{background:#A8D4EA;border-radius:3px}
#app{display:flex;height:100vh;position:relative}
#ov{position:fixed;inset:0;background:rgba(38,8,9,.5);z-index:110;opacity:0;pointer-events:none;transition:opacity var(--ease)}
#ov.show{opacity:1;pointer-events:all}
#sb{position:fixed;top:0;left:0;bottom:0;width:var(--sb);background:linear-gradient(180deg,#7BB8D4 0%,#5FA0BE 100%);z-index:120;display:flex;flex-direction:column;transform:translateX(0);transition:transform var(--ease)}
#sb.hide{transform:translateX(-100%)}
.sb-top{display:flex;align-items:center;height:var(--tbh);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sb-brand{flex:1;padding:0 18px;overflow:hidden}
.sb-name{font-family:var(--en);font-style:italic;font-weight:700;font-size:17px;color:var(--p);letter-spacing:.5px;white-space:nowrap}
.sb-sub{font-family:var(--zh);font-size:10px;color:rgba(248,244,227,.38);letter-spacing:2.5px;margin-top:1px;white-space:nowrap}
.sb-x{width:var(--tbh);height:var(--tbh);border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(248,244,227,.4);flex-shrink:0;transition:color .18s,background .18s}
.sb-x:hover{color:var(--p);background:rgba(255,255,255,.07)}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-sec{font-family:var(--en);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(248,244,227,.22);padding:14px 20px 4px}
.ni{display:flex;align-items:center;gap:11px;padding:10px 20px;width:100%;border:none;background:none;color:rgba(248,244,227,.52);cursor:pointer;font-family:var(--zh);font-size:13.5px;transition:color .18s,background .18s;position:relative;text-align:left}
.ni svg{flex-shrink:0;opacity:.7;transition:opacity .18s}
.ni:hover{color:var(--p);background:rgba(255,255,255,.07)}
.ni.on{color:var(--p);background:rgba(117,22,29,.38)}
.ni.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--gold);border-radius:0 2px 2px 0}
.sb-ft{padding:13px 20px;border-top:1px solid rgba(255,255,255,.07);font-family:var(--en);font-size:10.5px;color:rgba(248,244,227,.26);flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;margin-left:var(--sb);transition:margin-left var(--ease);min-width:0;overflow:hidden;background:var(--p)}
#main.expand{margin-left:0}
#tb{height:var(--tbh);background:var(--w);border-bottom:1px solid var(--p3);display:flex;align-items:center;gap:10px;padding:0 22px;flex-shrink:0;box-shadow:0 1px 4px rgba(38,8,9,.06)}
#hbg{width:36px;height:36px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);border-radius:var(--r);transition:background .18s;flex-shrink:0}
#hbg:hover{background:var(--p2)}
#pg-title{font-family:var(--zh);font-weight:700;font-size:16px;color:var(--ink);flex:1;letter-spacing:.3px;line-height:1.1;white-space:nowrap}
#tb-act{display:flex;gap:8px;align-items:center}
#pg{flex:1;overflow-y:auto;padding:22px 26px}
/* ══ RESPONSIVE BREAKPOINTS ══ */
/* Desktop: ≥1024px — full sidebar always visible */
/* Tablet:  600–1023px — collapsible sidebar, 2-col layouts */
/* Mobile:  <600px — drawer sidebar, single column, bottom nav */

/* ── Tablet ── */
@media(max-width:1023px){
  #main{margin-left:0!important}
  #sb{box-shadow:var(--sh3)}
  #sb.hide{box-shadow:none}
}
/* ── Desktop only: overlay never shown ── */
@media(min-width:1024px){
  #ov{display:none!important}
}

/* ── Tablet layout adjustments ── */
@media(max-width:1023px) and (min-width:600px){
  #pg{padding:16px 18px}
  .pos-lay{grid-template-columns:1fr 290px;gap:12px;height:calc(100vh - var(--tbh) - 36px)}
  .pos-g{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}
  .sg{grid-template-columns:repeat(2,1fr)!important}
  .g2{grid-template-columns:1fr 1fr}
  .modal{width:min(92vw,560px)!important}
}

/* ── Mobile layout ── */
@media(max-width:599px){
  :root{--tbh:48px}

  /* ── Layout ── */
  #pg{padding:10px 12px}
  #tb{padding:0 10px;height:var(--tbh)}
  #pg-title{font-size:12px;line-height:1;white-space:nowrap;letter-spacing:0;flex:0 0 auto}
  #pg-title{font-size:14px;letter-spacing:0}
  #main{padding-bottom:58px}
  #pg{padding-bottom:70px}

  /* ── Toolbar action buttons ── */
  #tb-act{gap:4px;flex:1;justify-content:flex-end}
  #tb-act .btn{padding:5px 9px;font-size:11px;gap:3px}
  #tb-act .btn svg{width:13px;height:13px}

  /* ── General buttons ── */
  .btn{padding:6px 11px;font-size:12px;gap:4px}
  .btn-lg{padding:11px 14px;font-size:13px}
  .btn-sm{padding:3px 7px;font-size:11px}

  /* ── POS layout: stack vertically ── */
  .pos-lay{
    display:flex!important;flex-direction:column!important;
    height:auto!important;overflow:visible!important;gap:8px;
  }
  .pos-l{overflow:visible!important;display:flex;flex-direction:column;gap:4px}
  .pos-g{grid-template-columns:repeat(2,1fr)!important;gap:6px;min-height:60px}

  /* POS product card */
  .pc{padding:8px 6px}
  .pc-nm{font-size:10.5px;margin-top:18px;line-height:1.3;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc-pr{font-size:12px}
  .pc-lt{font-size:7.5px;padding:1px 3px;
         white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}

  /* POS cart */
  .cp{height:auto!important;max-height:70vh!important}
  .mbr-zone{max-height:160px}
  .cp-it{min-height:70px;max-height:180px}
  .cp-hd{padding:10px 14px}
  .cp-hd span{font-size:13px}
  .cp-ft{max-height:none}
  .cp-ft-body{max-height:220px}

  /* ── Tables ── */
  .tw{-webkit-overflow-scrolling:touch;overflow-x:auto}
  th{padding:6px 8px;font-size:11px;white-space:nowrap}
  td{padding:7px 8px;font-size:12px}

  /* Bulk-bar */
  .bulk-bar{padding:7px 10px;gap:5px;flex-wrap:nowrap;overflow-x:auto}
  .bulk-bar .btn-sm{padding:3px 7px;font-size:10.5px;white-space:nowrap;flex-shrink:0}
  .bulk-cnt{font-size:12px}

  /* ── Cards ── */
  .card-hd{padding:9px 12px}
  .card-ttl{font-size:13px}
  .sc{padding:10px 12px}
  .sc-val{font-family:var(--en);font-size:22px;font-weight:700;color:var(--ink);margin:4px 0 2px;line-height:1.1}
  .sc-lbl{font-size:11px;color:var(--txt3);font-weight:500;line-height:1.3}
  .sc-sub{font-size:11px;color:var(--txt3);line-height:1.3}

  /* ── Badges ── */
  .bdg{font-size:10px;padding:1px 6px}

  /* ── Reports stat grids ── */
  .sg4{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .sg3{grid-template-columns:1fr!important;gap:8px!important}
  .sg2c{grid-template-columns:1fr!important;gap:8px!important}
  .sg{grid-template-columns:repeat(2,1fr)!important}
  .g2{grid-template-columns:1fr!important}

  /* ── Stat card mobile ── */
  .sc{padding:12px 14px!important}
  .sc-val{font-size:18px!important}
  .sc-lbl{font-size:10.5px!important}
  .sc-sub{font-size:10.5px!important}

  /* ── POS search bar ── */
  #pos-sw{width:auto!important;flex:1}
  #pos-srch{font-size:12px}
  /* ── sw input base ── */

  /* ── Modal: bottom sheet ── */
  .modal{width:100vw!important;max-width:100vw!important;
         border-radius:16px 16px 0 0;position:fixed;
         bottom:0;left:0;right:0;margin:0;max-height:92vh}
  .ovm{align-items:flex-end!important}

  /* ── Reports export buttons: icon-only on mobile ── */
  .rpt-exp-btn{padding:5px 8px!important}
  .rpt-exp-btn svg{flex-shrink:0}
  .rpt-exp-btn .btn-txt{display:none}
  .mhd{padding:12px 16px}
  .mttl{font-size:14px}
  .mbd{padding:16px!important}

  /* ── Sidebar ── */
  #sb{width:80vw!important}

  /* ── Bottom nav ── */
  #device-badge{display:none}
  #bottom-nav{display:flex!important}

  /* ── Member/order table: hide less important cols on mobile ── */
  .hide-mob{display:none!important}

  /* ── Form inputs ── */
  .fi{padding:8px 10px;font-size:13px}
  .fg label{font-size:10.5px}
}

/* ── Bottom nav (mobile only) ── */
#bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--ink);
  border-top:1px solid rgba(255,255,255,.1);
  z-index:90;height:58px;
  padding:0 4px;
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;
  color:rgba(248,244,227,.45);font-family:var(--zh);font-size:9.5px;
  transition:color .18s;padding:4px 2px;
}
.bn-item svg{opacity:.7;transition:opacity .18s;flex-shrink:0}
.bn-item.on{color:var(--p)}
.bn-item.on svg{opacity:1}
.bn-item.on::after{content:'';display:block;width:24px;height:2px;background:var(--gold);border-radius:2px;position:absolute;bottom:6px}
.bn-item{position:relative}

/* When bottom nav visible, add padding to main */

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-family:var(--zh);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;border:1.5px solid transparent;white-space:nowrap}
.btn-p{background:var(--cr);color:var(--p);border-color:var(--cr)}
.btn-p:hover{background:var(--cr2);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn-o{background:transparent;color:var(--ink);border-color:var(--p3)}
.btn-o:hover{background:var(--p2);border-color:var(--cr)}
.btn-g{background:transparent;color:var(--cr);border-color:transparent;padding:6px 10px}
.btn-g:hover{background:var(--p2)}
.btn-d{background:transparent;color:#8B1A1A;border-color:#D4ABAB}
.btn-d:hover{background:#f9eaea}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:11px 22px;font-size:15px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.card{background:var(--w);border:1.5px solid var(--p3);border-radius:var(--r2);box-shadow:var(--sh)}
.card-hd{padding:13px 18px;border-bottom:1.5px solid var(--p2);display:flex;align-items:center;justify-content:space-between}
.card-ttl{font-family:var(--zh);font-weight:700;font-size:13.5px;color:var(--ink)}
.sc{background:var(--w);border:1.5px solid var(--p3);border-radius:var(--r2);padding:14px 16px;min-width:0;position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.sc-acc{position:absolute;top:0;left:0;right:0;height:2.5px;background:var(--cr)}
.sc-lbl{font-size:11px;font-weight:500;color:var(--txt3);letter-spacing:.4px;margin-bottom:6px}
.sc-val{font-family:var(--en);font-size:24px;font-weight:700;color:var(--ink);line-height:1}
.sc-sub{font-size:11px;color:var(--txt3);margin-top:5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--p);border-bottom:2px solid var(--cr)}
th{padding:9px 14px;text-align:left;font-family:var(--zh);font-weight:700;font-size:11px;letter-spacing:.6px;color:var(--cr);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--p2);color:#333;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(248,244,227,.55)}
.tn{font-family:var(--en);font-weight:500}
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.bg{background:#e9f5ea;color:#1e6b2e;border:1px solid #b8dcb9}
.br{background:#fdecea;color:#b71c1c;border:1px solid #f5c0bd}
.ba{background:#fff8e1;color:#7a5800;border:1px solid #ffe082}
.bb{background:#e3f0fb;color:#1565c0;border:1px solid #b8d8f7}
.bi{background:rgba(38,8,9,.06);color:var(--ink);border:1px solid var(--p3)}
.bw{background:var(--wooly-lt);color:var(--wooly);border:1px solid #C9A8F0}
.bm{background:var(--mumu-lt);color:var(--mumu);border:1px solid #8ECFB0}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:5px;letter-spacing:.3px}
.fi,.fs{width:100%;padding:8px 11px;border:1.5px solid var(--p3);border-radius:var(--r);font-family:var(--zh);font-size:13px;background:var(--w);color:var(--txt);outline:none;transition:border-color .18s}
.fi:focus,.fs:focus{border-color:var(--cr);box-shadow:0 0 0 3px rgba(117,22,29,.1)}
.sw{display:flex;align-items:center;gap:8px;background:var(--w);border:1.5px solid var(--p3);border-radius:var(--r);padding:7px 11px;transition:border-color .18s}
.sw:focus-within{border-color:var(--cr)}
.sw input{border:none;outline:none;flex:1;font-family:var(--zh);font-size:13px;background:transparent;color:var(--txt)}
.sw input::placeholder{color:var(--txt3)}
.alw{padding:11px 15px;border-radius:var(--r);margin-bottom:14px;font-size:13px;display:flex;align-items:flex-start;gap:10px}
.alw-y{background:#fff8e6;border:1.5px solid #ffe08a;color:#7a5800}
.alw-g{background:#e9f5ea;border:1.5px solid #b8dcb9;color:#1e6b2e}
.alw-r{background:#fdecea;border:1.5px solid #f5c0bd;color:#b71c1c}
.tabs{display:flex;border-bottom:2px solid var(--p3);margin-bottom:16px}
.tab{padding:9px 16px;border:none;background:none;font-family:var(--zh);font-size:13px;font-weight:500;color:var(--txt3);cursor:pointer;transition:all .18s;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--cr)}
.tab.on{color:var(--cr);border-bottom-color:var(--cr);font-weight:700}
.ovm{position:fixed;inset:0;background:rgba(38,8,9,.55);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--p);border:1.5px solid var(--p3);border-radius:var(--r2);width:min(620px,92vw);max-height:88vh;overflow-y:auto;box-shadow:var(--sh3)}
.mhd{padding:16px 20px;border-bottom:1.5px solid var(--p3);display:flex;align-items:center;justify-content:space-between}
.mttl{font-family:var(--zh);font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.mbd{padding:20px}
.mft{padding:13px 20px;border-top:1.5px solid var(--p3);display:flex;justify-content:flex-end;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.rw td{background:#fff8e6!important}
.ot-w{background:var(--wooly-lt);color:var(--wooly);border:1px solid #C9A8F0;display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.ot-m{background:var(--mumu-lt);color:var(--mumu);border:1px solid #8ECFB0;display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.ot-s{background:#FFF8E6;color:#7A5800;border:1px solid #FFD770;display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
/* POS */
.pos-lay{display:grid;grid-template-columns:1fr 340px;gap:16px;height:calc(100vh - var(--tbh) - 44px);overflow:hidden}
.pos-l{display:flex;flex-direction:column;gap:11px;overflow:hidden}
.pos-f{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.cb{padding:5px 13px;border-radius:20px;border:1.5px solid var(--p3);background:var(--w);font-family:var(--zh);font-size:12px;font-weight:500;color:var(--txt2);cursor:pointer;transition:all .18s}
.cb:hover,.cb.on{background:#7BB8D4;color:#fff;border-color:#7BB8D4}
.cb-w.on{background:var(--wooly);border-color:var(--wooly)}
.cb-m.on{background:var(--mumu);border-color:var(--mumu)}
.pos-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;overflow-y:auto;padding-bottom:6px}
.pc{background:var(--w);border:1.5px solid var(--p3);border-radius:var(--r2);padding:13px 11px;cursor:pointer;transition:all .2s;text-align:center;position:relative;box-shadow:var(--sh)}
.pc:hover{border-color:var(--cr);transform:translateY(-2px);box-shadow:var(--sh2)}
.pc.out{opacity:.35;cursor:not-allowed;pointer-events:none}
.pc-ow{position:absolute;top:7px;left:7px}
.pc-lt{position:absolute;top:7px;right:7px;background:var(--gold);color:var(--w);font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px}
.pc-nm{font-weight:700;font-size:12px;color:var(--ink);line-height:1.35;margin-bottom:4px;margin-top:24px}
.pc-pr{font-family:var(--en);font-size:15px;font-weight:700;color:var(--cr);margin-bottom:2px}
.pc-st{font-size:10.5px;color:var(--txt3)}
/* Cart */
/* Cart panel: fixed header → scrollable member zone → scrollable items → scrollable totals → sticky button */
.cp{background:var(--w);border:1.5px solid var(--p3);border-radius:var(--r2);box-shadow:var(--sh);
    display:flex;flex-direction:column;overflow:hidden;height:100%;min-height:0}
.cp-hd{background:#7BB8D4;color:#fff;padding:12px 15px;display:flex;align-items:center;
    justify-content:space-between;flex-shrink:0}
.cp-lbl{font-family:var(--zh);font-weight:700;font-size:13.5px;letter-spacing:.5px}
.cp-cnt{font-family:var(--en);font-size:11px;opacity:.5}
.mbr-zone{padding:10px 11px;border-bottom:1px solid var(--p2);flex-shrink:0;
    background:var(--p);max-height:38%;overflow-y:auto}
.mbr-row{display:flex;gap:6px;align-items:center}
.mbr-info{margin-top:7px;padding:8px 10px;background:var(--w);border-radius:var(--r);
    border:1.5px solid var(--p3);font-size:12px}
.mbr-info.found{border-color:#b8dcb9;background:#e9f5ea}
.mbr-info.notfound{border-color:#f5c0bd;background:#fdecea}
.cp-it{flex:1;overflow-y:auto;padding:9px 11px;min-height:60px}
.cp-em{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--p3)}
.cp-em-txt{font-size:12px;color:var(--txt3)}
.cit{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--p2)}
.cit:last-child{border-bottom:none}
.cn{flex:1;min-width:0}
.cn-nm{font-size:12px;font-weight:500;color:var(--ink);line-height:1.3}

.pay-g{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:9px}
.po{padding:6px 4px;border-radius:var(--r);border:1.5px solid var(--p3);background:var(--w);font-family:var(--zh);font-size:11px;font-weight:500;cursor:pointer;text-align:center;color:var(--txt2);transition:all .15s}
.po:hover,.po.on{background:var(--ink);color:var(--p);border-color:var(--ink)}
.dr{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt3)}

.dr input:focus{border-color:var(--cr)}
/* Receipt */

.rb{text-align:center;font-family:var(--en);font-style:italic;font-weight:700;font-size:17px;color:var(--ink)}
.rs{text-align:center;font-family:var(--zh);font-size:10.5px;color:var(--txt3);letter-spacing:3px;margin-bottom:12px}

.bl{font-family:var(--en);font-size:10px;color:var(--txt3)}

.ti-fi{height:4px;background:var(--cr);border-radius:3px}

.ck-w{flex:1;font-size:13px;font-weight:500}

/* ── 列印樣式：只印收據內容，移除所有背景 ── */
@media print {
  /* 整個系統的 html/body 平常被鎖死成「高度=螢幕高、超出隱藏」（單頁應用內部自己捲動用），
     列印時如果不解除，收據內容再怎麼調整都會被這層限制卡住印不出來，這是真正的根本原因 */
  html, body { height: auto !important; overflow: visible !important; }
  /* 隱藏所有 UI */
  body > *:not(.ovm) { display: none !important; }
  .ovm:not(.printing) { display: none !important; }
  .ovm { position: static !important; inset: auto !important; background: none !important;
         display: block !important; width: 100% !important; height: auto !important; }
  /* 收據視窗平常有 max-height:88vh + overflow-y:auto（螢幕上用捲動看），
     列印時若不解除，超出視窗高度的品項/備註/感謝詞會被直接裁掉印不出來，這裡強制攤開全部內容 */
  .modal { box-shadow: none !important; border: none !important;
           border-radius: 0 !important; background: transparent !important;
           max-height: none !important; overflow: visible !important;
           width: 100% !important; max-width: 100% !important; margin: 0 !important; }
  .mhd, .mft { display: none !important; }
  .mbd { padding: 0 !important; }
  /* 收據本體：去掉所有邊框背景，純文字 */
  .rp { border: none !important; border-radius: 0 !important;
        background: transparent !important; padding: 0 !important;
        max-width: 100% !important; margin: 0 !important; }
  .rhr { border-top: 1px dashed #000 !important; }
  /* 移除所有色彩背景 */
  * { background: transparent !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact; }
  /* 頁面設定：80mm 熱感紙寬，無邊距 */
  @page { size: 80mm auto; margin: 4mm; }
}

<script>
// ══ 授權碼驗證 ══
// ══ FIREBASE 初始化 ══
const firebaseConfig = {
  apiKey: "AIzaSyDtQb0z0ZGhgyTtKtFRNLiyAdYOMMK78gQ",
  authDomain: "hamster-shop-pos.firebaseapp.com",
  projectId: "hamster-shop-pos",
  storageBucket: "hamster-shop-pos.firebasestorage.app",
  messagingSenderId: "522798051865",
  appId: "1:522798051865:web:867f5a2b27401d817df088"
};
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) {
  console.warn('Firebase 初始化失敗（離線模式）:', e);
}

// ── Firebase 狀態 ──
let fbReady = false;
let fbListeners = []; // 儲存 unsubscribe functions
let pendingFBWrites = 0; // 尚未完成的雲端寫入次數，用來提醒使用者「同步中先別關頁面」

// ── 上次已同步到雲端的資料快照（用來比對出「真正變動過」的項目，避免整批集合重寫爆用量）──
let lastSyncedSnapshot = { products: [], members: [], orders: [], employees: [], restockLog: [], shopConfig: {}, tierConfig: [] };
let syncDebounceTimer = null;

// ── Firestore 集合參照 ──
const COL = {
  products:   () => db && db.collection('products'),
  members:    () => db && db.collection('members'),
  orders:     () => db && db.collection('orders'),
  employees:  () => db && db.collection('employees'),
  restockLog: () => db && db.collection('restockLog'),
  config:     () => db && db.collection('config'),
};

// ── 序列化：移除 undefined，確保 Firestore 可接受 ──
function sanitize(obj) {
  return JSON.parse(JSON.stringify(obj, (k, v) => v === undefined ? null : v));
}

// ══ FIREBASE CRUD ══

// 儲存整批資料到 Firestore（批次寫入）
async function saveCollectionToFB(colName, arr, idField = 'id') {
  pendingFBWrites++;
  try {
    const col = db.collection(colName);
    const batch = db.batch();
    arr.forEach(item => {
      const ref = col.doc(item[idField]);
      batch.set(ref, sanitize(item));
    });
    await batch.commit();
  } catch(e) { console.warn('FB save error:', colName, e); }
  finally { pendingFBWrites = Math.max(0, pendingFBWrites-1); }
}

// 刪除 Firestore 中已不存在的文件
async function syncDeletesFB(colName, localArr, idField = 'id') {
  pendingFBWrites++;
  try {
    const snap = await db.collection(colName).get();
    const localIds = new Set(localArr.map(x => x[idField]));
    const batch = db.batch();
    snap.docs.forEach(doc => {
      if (!localIds.has(doc.id)) batch.delete(doc.ref);
    });
    await batch.commit();
  } catch(e) { console.warn('FB delete sync error:', colName, e); }
  finally { pendingFBWrites = Math.max(0, pendingFBWrites-1); }
}

// 儲存單一文件到 Firestore
async function saveDocToFB(colName, id, data) {
  pendingFBWrites++;
  try {
    await db.collection(colName).doc(id).set(sanitize(data));
  } catch(e) { console.warn('FB doc save error:', colName, id, e); }
  finally { pendingFBWrites = Math.max(0, pendingFBWrites-1); }
}

// 刪除 Firestore 文件
async function deleteDocFromFB(colName, id) {
  pendingFBWrites++;
  try {
    await db.collection(colName).doc(id).delete();
  } catch(e) { console.warn('FB delete error:', colName, id, e); }
  finally { pendingFBWrites = Math.max(0, pendingFBWrites-1); }
}

// ── 從 Firestore 載入所有資料 ──
async function loadFromFB() {
  if (!db) return false;
  try {
    showSyncStatus('載入中…');
    const [prodSnap, memSnap, ordSnap, empSnap, logSnap, cfgSnap] = await Promise.all([
      COL.products().orderBy('sortOrder').get(),
      COL.members().get(),
      COL.orders().orderBy('date', 'desc').get(),
      COL.employees().get(),
      COL.restockLog().orderBy('ts', 'desc').get(),
      COL.config().get(),
    ]);
    if (!prodSnap.empty || !memSnap.empty || !ordSnap.empty) {
      products   = prodSnap.docs.map(d => d.data());
      members    = memSnap.docs.map(d => d.data());
      orders     = ordSnap.docs.map(d => d.data());
      employees  = empSnap.docs.map(d => d.data());
      restockLog = logSnap.docs.map(d => { const data = d.data(); if (!data.id) data.id = d.id; return data; });
      cfgSnap.docs.forEach(d => {
        if (d.id === 'shopConfig')  Object.assign(shopConfig, d.data());
        if (d.id === 'tierConfig')  tierConfig = d.data().tiers || tierConfig;
      });
      // 補齊欄位
      if (!shopConfig.pointsRate)  shopConfig.pointsRate  = 100;
      if (!shopConfig.redeemItems) shopConfig.redeemItems = [];
      if (!shopConfig.owners || shopConfig.owners.length < 2) shopConfig.owners = ['Wooly', 'MuMu'];
      products.forEach((p, i) => { if (p.sortOrder === undefined) p.sortOrder = i; });
      // 這批資料本來就來自雲端，標記為「已同步」基準，避免等一下又原封不動寫回去浪費用量
      lastSyncedSnapshot = {
        products: sanitize(products), members: sanitize(members), orders: sanitize(orders),
        employees: sanitize(employees), restockLog: sanitize(restockLog),
        shopConfig: sanitize(shopConfig), tierConfig: sanitize(tierConfig),
      };
      saveToLocal(); // 同步到 localStorage 備援
      showSyncStatus('✅ 已同步');
      fbReady = true;
      return true;
    } else {
      // Firestore 是空的 → 全新開始（不自動上傳本機舊資料，避免污染雲端）
      lastSyncedSnapshot = { products: [], members: [], orders: [], employees: [], restockLog: [], shopConfig: sanitize(shopConfig), tierConfig: sanitize(tierConfig) };
      showSyncStatus('✅ 全新開始');
      fbReady = true;
      return false;
    }
  } catch(e) {
    console.warn('FB load error:', e);
    showSyncStatus('⚠ 離線模式');
    return loadFromLocal();
  }
}

// ── 把所有本機資料推送到 Firestore（同時刪除雲端已不存在於本機的資料，確保刪除動作真的生效）──
async function pushAllToFB() {
  if (!db) return;
  await Promise.all([
    saveCollectionToFB('products', products),
    saveCollectionToFB('members', members),
    saveCollectionToFB('orders', orders),
    saveCollectionToFB('employees', employees),
    saveCollectionToFB('restockLog', restockLog),
    saveDocToFB('config', 'shopConfig', shopConfig),
    saveDocToFB('config', 'tierConfig', { tiers: tierConfig }),
  ]);
  // 注意：這裡刻意不做「整批比對雲端、刪掉本機沒有的資料」──
  // 在多裝置同步情境下，這台裝置的本機記憶不一定是最新的（例如另一台裝置剛新增、
  // 還沒同步回來），用差集去刪雲端資料會誤刪別台裝置剛新增的東西。
  // 真正的刪除一律由使用者按下刪除鈕時，呼叫 deleteDocFromFB() 針對「那一筆」直接刪除。
}

// ── 找出某集合裡「和上次已同步快照相比，內容真的不一樣」的項目 ──
function diffChanged(colName, arr, idField = 'id') {
  const prevArr = lastSyncedSnapshot[colName] || [];
  const prevMap = new Map(prevArr.map(x => [x[idField], JSON.stringify(x)]));
  return arr.filter(item => prevMap.get(item[idField]) !== JSON.stringify(sanitize(item)));
}

// ── 只把「真正變動過」的項目寫回 Firestore，取代整批集合重寫（大幅降低寫入次數/用量）──
async function syncChangedToFB() {
  if (!db) return;
  try {
    const colData = { products, members, orders, employees, restockLog };
    const jobs = [];
    Object.keys(colData).forEach(colName => {
      const changed = diffChanged(colName, colData[colName]);
      if (changed.length) jobs.push(saveCollectionToFB(colName, changed));
    });
    if (JSON.stringify(sanitize(shopConfig)) !== JSON.stringify(lastSyncedSnapshot.shopConfig)) {
      jobs.push(saveDocToFB('config', 'shopConfig', shopConfig));
    }
    if (JSON.stringify(sanitize(tierConfig)) !== JSON.stringify(lastSyncedSnapshot.tierConfig)) {
      jobs.push(saveDocToFB('config', 'tierConfig', { tiers: tierConfig }));
    }
    if (!jobs.length) return; // 沒有任何變動，完全不打 Firestore，節省額度
    await Promise.all(jobs);
    // 寫入成功後，把這次的內容標記為「已同步」基準
    lastSyncedSnapshot = {
      products: sanitize(products), members: sanitize(members), orders: sanitize(orders),
      employees: sanitize(employees), restockLog: sanitize(restockLog),
      shopConfig: sanitize(shopConfig), tierConfig: sanitize(tierConfig),
    };
  } catch(e) { console.warn('syncChangedToFB error:', e); throw e; }
}

// ── 標記單一項目為「已同步」，避免直接寫入 Firestore 後、防抖排程又重複寫一次同樣的東西 ──
function markItemSynced(colName, item, idField = 'id') {
  const clean = sanitize(item);
  const arr = (lastSyncedSnapshot[colName] || []).slice();
  const idx = arr.findIndex(x => x[idField] === item[idField]);
  if (idx >= 0) arr[idx] = clean; else arr.push(clean);
  lastSyncedSnapshot[colName] = arr;
}

// ── 防抖排程：短時間內連續編輯（例如打字）只會合併成一次雲端寫入 ──
function scheduleSync() {
  pendingFBWrites++; // 排程期間也視為「有未完成的同步」，避免使用者在防抖等待中關頁
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => {
    showSyncStatus('🔄 同步中…');
    syncChangedToFB()
      .then(() => showSyncStatus('✅ 已同步 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'})))
      .catch(() => showSyncStatus('⚠ 同步失敗，請確認網路'))
      .finally(() => { pendingFBWrites = Math.max(0, pendingFBWrites-1); });
  }, 800);
}

// ── 手動清理：把雲端上「所有裝置都已經看不到」的孤兒資料清掉（僅在資料管理頁手動觸發，不會自動跑）──
async function manualCleanupOrphans(colName, localArr, idField = 'id') {
  return syncDeletesFB(colName, localArr, idField);
}

// ── 即時監聽（讓兩台裝置同步）──
function startRealtimeSync() {
  if (!db) return;
  // 清除舊監聽
  fbListeners.forEach(unsub => unsub());
  fbListeners = [];

  const listen = (colName, setter, transform) => {
    const unsub = db.collection(colName).onSnapshot(snap => {
      if (!fbReady) return;
      const data = snap.docs.map(d => { const item = d.data(); if (!item.id) item.id = d.id; return item; });
      const finalData = transform ? transform(data) : data;
      setter(finalData);
      // 這筆資料本來就是從雲端來的，標記為「已同步」基準，避免防抖排程又原封不動寫回去浪費用量
      lastSyncedSnapshot[colName] = sanitize(finalData);
      saveToLocal();
      // 重新渲染目前頁面
      const curPage = document.querySelector('.ni.on')?.dataset.page;
      if (curPage && PF[curPage]) PF[curPage]();
      showSyncStatus('✅ 已同步 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'}));
    }, err => { console.warn('Realtime sync error:', colName, err); showSyncStatus('⚠ 同步中斷'); });
    fbListeners.push(unsub);
  };

  listen('products',   d => { products   = d; }, d => d.sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999)));
  listen('members',    d => { members    = d; });
  listen('orders',     d => { orders     = d.sort((a,b)=>b.date.localeCompare(a.date)); });
  listen('employees',  d => { employees  = d; });
  listen('restockLog', d => { restockLog = d.sort((a,b)=>b.ts?.localeCompare(a.ts)); });
  db.collection('config').onSnapshot(snap => {
    if (!fbReady) return;
    snap.docs.forEach(doc => {
      if (doc.id === 'shopConfig')  Object.assign(shopConfig, doc.data());
      if (doc.id === 'tierConfig')  tierConfig = doc.data().tiers || tierConfig;
    });
    // 同樣標記為已同步基準，避免寫回去
    lastSyncedSnapshot.shopConfig = sanitize(shopConfig);
    lastSyncedSnapshot.tierConfig = sanitize(tierConfig);
    saveToLocal();
  });
}

// ── 同步狀態指示器 ──
function showSyncStatus(msg) {
  let el = document.getElementById('sync-status');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-status';
    el.style.cssText = 'position:fixed;bottom:70px;right:16px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;z-index:999;font-family:var(--en);pointer-events:none;transition:opacity .5s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  if (msg.startsWith('✅')) {
    setTimeout(() => { el.style.opacity = '0'; }, 3000);
    hideSyncFailBanner();
  } else if (msg.startsWith('⚠')) {
    showSyncFailBanner();
  }
}

// ── 雲端同步失敗時的頂部提醒條：提供「立即下載備份」，避免關頁/刷新後資料遺失 ──
function showSyncFailBanner() {
  let bar = document.getElementById('sync-fail-banner');
  if (bar) return; // 已經顯示中，不重複建立
  bar = document.createElement('div');
  bar.id = 'sync-fail-banner';
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:300;background:#fdecea;border-bottom:1px solid #f5c0bd;color:#b71c1c;font-size:12.5px;padding:8px 14px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;font-family:var(--zh);box-shadow:0 2px 10px rgba(0,0,0,.08)';
  bar.innerHTML =
    '<span>⚠ 雲端同步失敗（可能是今日額度已用完），目前變更只存在這台裝置，關閉或整理頁面前建議先備份</span>' +
    '<button id="sync-fail-backup-btn" style="background:#b71c1c;color:#fff;border:none;border-radius:8px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:var(--zh);flex-shrink:0">立即下載備份</button>' +
    '<button id="sync-fail-dismiss" style="background:none;border:none;color:#b71c1c;font-size:17px;cursor:pointer;padding:0 6px;line-height:1;flex-shrink:0">×</button>';
  document.body.appendChild(bar);
  bar.querySelector('#sync-fail-backup-btn').addEventListener('click', () => exportBackup());
  bar.querySelector('#sync-fail-dismiss').addEventListener('click', () => bar.remove());
}

function hideSyncFailBanner() {
  document.getElementById('sync-fail-banner')?.remove();
}


const AUTH_CODE_KEY = 'wm_auth_code';
function getAuthCode() { return localStorage.getItem(AUTH_CODE_KEY) || '2026'; }

(function initAuthGate() {
  const gate = document.getElementById('auth-gate');
  const app  = document.getElementById('app');
  const input = document.getElementById('auth-input');
  const err   = document.getElementById('auth-err');
  const submit = document.getElementById('auth-submit');

  if (sessionStorage.getItem('wm_authed') === '1') {
    gate.style.display = 'none';
    app.style.display = '';
  } else {
    input.focus();
  }

  function tryAuth() {
    if (input.value.trim() === getAuthCode()) {
      sessionStorage.setItem('wm_authed', '1');
      gate.style.display = 'none';
      app.style.display = '';
    } else {
      err.textContent = '授權碼錯誤，請重新輸入';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', tryAuth);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });
})();

// ══ 角色權限（闆娘 / 店員）══
const ROLE_PIN_KEY = 'wm_role_pin';
function getRolePin() { return localStorage.getItem(ROLE_PIN_KEY) || '5678'; }
function currentRole() { return sessionStorage.getItem('wm_role') || null; }
function isStaffMode() { return currentRole() === 'staff'; }
// 店員模式下唯一開放的頁面：其餘（報表、闆娘分帳、員工管理、賣貨便月結、資料管理、管理設定）一律視為闆娘專用
const STAFF_ALLOWED_PAGES = ['pos', 'inventory', 'orders', 'members'];

(function initRoleGate() {
  const gate = document.getElementById('role-gate');
  const staffBtn = document.getElementById('role-staff-btn');
  const ownerBtn = document.getElementById('role-owner-btn');
  const pinArea = document.getElementById('role-pin-area');
  const pinInput = document.getElementById('role-pin-input');
  const pinErr = document.getElementById('role-pin-err');
  const pinSubmit = document.getElementById('role-pin-submit');

  function showRoleGateIfNeeded() {
    if (document.getElementById('auth-gate').style.display !== 'none') return; // 裝置還沒解鎖，先不管
    if (currentRole()) { applyRolePermissions(); }
    else { gate.style.display = 'flex'; }
  }
  // 裝置解鎖後（含已在本次分頁解鎖過的情況）都要檢查一次身份
  showRoleGateIfNeeded();
  const authSubmit = document.getElementById('auth-submit');
  const authInput = document.getElementById('auth-input');
  const _checkAfterAuth = () => setTimeout(showRoleGateIfNeeded, 0);
  authSubmit.addEventListener('click', _checkAfterAuth);
  authInput.addEventListener('keydown', e => { if (e.key === 'Enter') _checkAfterAuth(); });

  function enterAs(role) {
    sessionStorage.setItem('wm_role', role);
    gate.style.display = 'none';
    applyRolePermissions();
  }
  staffBtn.addEventListener('click', () => enterAs('staff'));
  ownerBtn.addEventListener('click', () => { pinArea.style.display = 'block'; pinInput.focus(); });
  function tryOwnerPin() {
    if (pinInput.value.trim() === getRolePin()) { enterAs('owner'); }
    else { pinErr.textContent = '授權碼錯誤'; pinInput.value = ''; pinInput.focus(); }
  }
  pinSubmit.addEventListener('click', tryOwnerPin);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryOwnerPin(); });
})();

// ── 依身份隱藏/鎖住對應功能：店員模式看不到、點不到闆娘專用頁面 ──
function applyRolePermissions() {
  const staff = isStaffMode();
  document.querySelectorAll('.ni[data-page], .bn-item[data-page]').forEach(btn => {
    const page = btn.dataset.page;
    if (staff && !STAFF_ALLOWED_PAGES.includes(page)) {
      btn.style.display = 'none';
    } else {
      btn.style.display = '';
    }
  });
  // 頂部工具列身份標示 + 切換身份按鈕
  let badge = document.getElementById('role-badge');
  if (!badge) {
    badge = document.createElement('button');
    badge.id = 'role-badge';
    badge.style.cssText = 'font-size:11px;border:none;border-radius:6px;padding:4px 10px;font-family:var(--zh);cursor:pointer;margin-right:8px';
    const tb = document.getElementById('tb');
    tb.insertBefore(badge, document.getElementById('tb-act'));
    badge.addEventListener('click', () => {
      if (!confirm('要切換操作身份嗎？')) return;
      sessionStorage.removeItem('wm_role');
      document.getElementById('role-gate').style.display = 'flex';
    });
  }
  if (staff) { badge.textContent = '🧑‍💼 店員模式'; badge.style.background = 'var(--p2)'; badge.style.color = 'var(--txt2)'; }
  else       { badge.textContent = '👑 闆娘模式'; badge.style.background = 'var(--cr-lt)'; badge.style.color = 'var(--cr2)'; }
}

// ── 若店員模式下試圖切換到闆娘專用頁面（例如舊書籤、殘留的按鈕事件），一律擋下並導回收銀台 ──
function guardPageAccess(page) {
  if (isStaffMode() && !STAFF_ALLOWED_PAGES.includes(page)) {
    showToast('⛔ 此功能僅限闆娘使用');
    return false;
  }
  return true;
}

const IC = {

// 把任意 Date 物件轉成「本地時區」的 YYYY-MM-DD，取代會誤用 UTC 時間的 toISOString().slice(0,10)
function localDateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');

function genId() {
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const cnt = orders.filter(o => o.id.includes(ymd)).length + 1;
  return 'WB-' + ymd + '-' + String(cnt).padStart(3,'0');
}

function normPhone(p) { return (p||'').replace(/[-\s]/g,''); }
function isValidPhone(p) {
  const n = normPhone(p);
  // 台灣手機：09 開頭共 10 碼；也接受市話 02~08 開頭 8~10 碼
  return /^09\d{8}$/.test(n) || /^0[2-8]\d{7,8}$/.test(n);
}

function getTierById(id) { return tierConfig.find(t => t.id === id) || tierConfig[0]; }

function getTierIdBySpend(spend) {
  const sorted = [...tierConfig].sort((a,b) => b.minSpend - a.minSpend);
  const t = sorted.find(x => spend >= x.minSpend);
  return t ? t.id : 0;
}

function tierBadge(tierId) {
  const t = getTierById(tierId);
  return '<span class="bdg" style="background:'+t.bg+';color:'+t.color+';border:1px solid '+t.border+'">'+t.name+'</span>';
}

function ownerTag(owner) {
  const o1 = shopConfig.owners[0], o2 = shopConfig.owners[1];
  if (owner === o1) return '<span class="ot-w">' + o1 + '</span>';
  if (owner === o2) return '<span class="ot-m">' + o2 + '</span>';
  return '<span class="ot-s">⚖ 共同</span>';
}

function getMemberOrders(mid) {
  // 只有「整筆訂單全部退款」才不算數；「部分退款」代表顧客仍有實際消費，應繼續計入消費次數/到訪紀錄
  return orders.filter(o => o.memberId === mid && (o.status === '完成' || o.status === '部分退款'))
               .sort((a,b) => b.date.localeCompare(a.date));
}

function getReturnRate() {
  if (!members.length) return 0;
  const ret = members.filter(m => getMemberOrders(m.id).length > 1).length;
  return Math.round((ret / members.length) * 100);
}

function getDaysSince(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / (1000*60*60*24));
}

function getAvgInterval(mid) {
  const mo = getMemberOrders(mid);
  if (mo.length < 2) return null;
  const dates = mo.map(o => new Date(o.date));
  let total = 0;
  for (let i = 0; i < dates.length-1; i++) total += (dates[i] - dates[i+1]) / (1000*60*60*24);
  return Math.round(total / (dates.length-1));
}


// ── Bulk Select Helper ──
function makeBulkBar(wrapId, getItems, deleteFn, afterFn, colName) {
  const wrap = ge(wrapId);
  if (!wrap) return;

  function getCheckedIds() {
    return [...wrap.querySelectorAll('.row-cb:checked')].map(el => el.dataset.id);
  }

  function syncBar() {
    const all = [...wrap.querySelectorAll('.row-cb')];
    const checked = all.filter(el => el.checked);
    const cntEl = wrap.querySelector('.bulk-cnt');
    if (cntEl) cntEl.textContent = checked.length;
    const delBtn = wrap.querySelector('.bulk-del-btn');
    if (delBtn) delBtn.disabled = checked.length === 0;
    const hdrCb = wrap.querySelector('.hdr-cb');
    if (hdrCb) {
      hdrCb.checked = all.length > 0 && checked.length === all.length;
      hdrCb.indeterminate = checked.length > 0 && checked.length < all.length;
    }
    wrap.querySelectorAll('tbody tr').forEach(tr => {
      const cb = tr.querySelector('.row-cb');
      tr.classList.toggle('sel-row', !!(cb && cb.checked));
    });
  }

  // Use event delegation on wrap - works even after innerHTML re-renders
  wrap.addEventListener('change', function(e) {
    if (e.target.classList.contains('hdr-cb')) {
      wrap.querySelectorAll('.row-cb').forEach(cb => { cb.checked = e.target.checked; });
      syncBar();
    } else if (e.target.classList.contains('row-cb')) {
      syncBar();
    }
  });

  // select all
  const selAllBtn = wrap.querySelector('.bulk-sel-all');
  if (selAllBtn) selAllBtn.addEventListener('click', () => {
    wrap.querySelectorAll('.row-cb').forEach(cb => { cb.checked = true; });
    syncBar();
  });
  // deselect all
  const deselBtn = wrap.querySelector('.bulk-desel-all');
  if (deselBtn) deselBtn.addEventListener('click', () => {
    wrap.querySelectorAll('.row-cb').forEach(cb => { cb.checked = false; });
    syncBar();
  });

  // delete
  const delBtn = wrap.querySelector('.bulk-del-btn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      const ids = getCheckedIds();
      if (!ids.length) return;
      if (!confirm('確定刪除選取的 ' + ids.length + ' 筆資料？')) return;
      deleteFn(ids);
      saveToLocal();
      afterFn();
      if (fbReady && colName) {
        try { await Promise.all(ids.map(id => deleteDocFromFB(colName, id))); }
        catch(e) { console.warn('批次雲端刪除失敗:', e); }
      }
    });
  }

  syncBar();
}

function exportCSV(filename, rows, headers) {
  const BOM = '\uFEFF';
  const lines = [headers.join(','), ...rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(','))];
  const blob = new Blob([BOM + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

function showToast(msg) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--p);padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;box-shadow:var(--sh3);opacity:1;transition:opacity .3s';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2200);
}

function searchMember() {

  if (!phone) return;
  const infoEl = ge('mbr-info');
  if (!isValidPhone(phone)) {
    infoEl.className = 'mbr-info miss';
    infoEl.innerHTML = '<span style="color:var(--cr);font-size:12.5px">⚠ 手機格式錯誤，請輸入 09 開頭 10 碼</span>';
    return;
  }
  const m = members.find(x => normPhone(x.phone) === phone);
  if (m) {
    cartMember = m;
    const t = getTierById(m.tier);
    discount = t.discPct;
    const dp = ge('disc-pct'); if (dp) dp.value = discount;
    infoEl.className = 'mbr-info found';
    infoEl.style.display = 'block';
    const maxDeductAmt = shopConfig.pointsRate > 0 ? Math.floor(m.points / shopConfig.pointsRate) : 0;
    const redeemList = shopConfig.redeemItems || [];
    infoEl.innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:' + (m.points>0||redeemList.length>0?'8':'0') + 'px">' +

        '<span style="font-family:var(--en);font-size:12px;color:var(--gold)">★ ' + m.points + ' pt</span>' +

function restoreStock(it, qty) {
  const prod = it.pid ? products.find(p => p.id===it.pid) : products.find(p => p.name===it.name);
  if (!prod) return;
  if (it.variantId) {
    const v = (prod.variants||[]).find(x => x.id===it.variantId);
    if (v) { v.stock += qty; prod.stock = (prod.variants||[]).reduce((s,x)=>s+x.stock,0); return; }
  }
  prod.stock += qty;
}

function addToCart(pid) {
  const p = products.find(x => x.id===pid); if (!p || p.stock===0) return;
  if (p.variants && p.variants.length) { openVariantPickModal(p); return; }
  const ex = cart.find(x => x.id===pid && !x.variantId);
  if (ex) { if (ex.qty >= p.stock) return; ex.qty++; }
  else cart.push({...p, qty:1});
  renderCartItems();
}

function openVariantPickModal(p) {
  const ov = document.createElement('div'); ov.className='ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:380px">' +
      '<div class="mhd"><div class="mttl">選擇規格－' + p.name + '</div><button class="btn-g" id="vp-x">' + IC.x + '</button></div>' +
      '<div class="mbd" style="display:flex;flex-direction:column;gap:8px">' +
        p.variants.map(v =>
          '<button type="button" class="btn btn-o vp-opt" data-vid="' + v.id + '"' + (v.stock<=0?' disabled':'') + ' style="display:flex;justify-content:space-between;align-items:center;padding:13px 15px;width:100%' + (v.stock<=0?';opacity:.4' : '') + '">' +
            '<span style="font-weight:600">' + v.name + '</span>' +
            '<span style="font-size:12px;color:' + (v.stock<=0?'#b71c1c':'var(--txt3)') + '">' + (v.stock>0 ? '庫存 '+v.stock+' '+(p.unit||'') : '已售完') + '</span>' +

function addVariantToCart(pid, variantId) {
  const p = products.find(x => x.id===pid); if (!p) return;
  const v = (p.variants||[]).find(x => x.id===variantId); if (!v || v.stock<=0) return;
  const ex = cart.find(x => x.id===pid && x.variantId===variantId);
  if (ex) {
    if (ex.qty >= v.stock) { showToast('已達「' + v.name + '」庫存上限'); return; }
    ex.qty++;
  } else {
    cart.push({...p, qty:1, variantId: v.id, spec: v.name, variantStock: v.stock});
  }
  renderCartItems();
}

function cartKeyOf(it) { return it.variantId ? (it.id + '::' + it.variantId) : it.id; }

function renderCartItems() {
  const el = ge('cp-items'); if (!el) return;
  const cnt = ge('cp-cnt');
  if (cnt) cnt.textContent = cart.length > 0 ? cart.reduce((s,x)=>s+x.qty,0) + ' 件' : '';
  if (cart.length === 0) {
    el.innerHTML = '<div class="cp-em">' + IC.cart + '<div class="cp-em-txt">點選左側商品加入</div></div>';
  } else {
    el.innerHTML = cart.map(it =>
      '<div class="cit">' +
        '<div class="cn">' +
          '<div class="cn-nm">' + it.name + '</div>' +
          (it.variantId ? '<div style="font-size:10.5px;color:var(--txt3);margin:1px 0 2px">規格：' + it.spec + '</div>' : '') +
          '<div class="cn-ct">' + ownerTag(it.owner) + '<span>' + it.cat + '</span></div>' +
        '</div>' +
        '<div class="cq">' +
          '<button class="qb" data-ck="' + cartKeyOf(it) + '" data-d="-1">−</button>' +
          '<span class="qn">' + it.qty + '</span>' +
          '<button class="qb" data-ck="' + cartKeyOf(it) + '" data-d="1">+</button>' +
        '</div>' +
        '<div class="cpr">' + fm(it.price*it.qty) + '</div>' +
        '<button class="dx" data-ck="' + cartKeyOf(it) + '" data-d="-999">' + IC.x + '</button>' +
      '</div>'
    ).join('');
    el.querySelectorAll('[data-ck][data-d]').forEach(btn => {
      btn.addEventListener('click', () => updateQty(btn.dataset.ck, parseInt(btn.dataset.d)));
    });
  }
  renderCartTotals();
}

function updateQty(ck, d) {
  const i = cart.findIndex(x => cartKeyOf(x)===ck); if (i<0) return;
  if (d > 0) {
    const it = cart[i];
    const p = products.find(x => x.id===it.id);
    const cap = it.variantId ? (p?.variants||[]).find(v=>v.id===it.variantId)?.stock : p?.stock;
    if (cap != null && it.qty >= cap) { showToast('已達庫存上限'); return; }
  }
  cart[i].qty = Math.max(0, cart[i].qty + d);
  if (cart[i].qty === 0) cart.splice(i,1);
  renderCartItems();
}

function renderCartTotals() {
  const sub  = cart.reduce((s,x) => s+x.price*x.qty, 0);
  const dAmt = Math.round(sub * (discount/100));
  const ptDeduct = (usePoints && cartMember)
    ? Math.min(Math.floor(cartMember.points / shopConfig.pointsRate), Math.max(0, sub - dAmt - discountFix))
    : 0;
  const tot  = Math.max(0, sub - dAmt - discountFix - ptDeduct);
  // Update simplified footer
  const s = ge('cp-sub'); if (s) s.textContent = fm(sub);
  const t = ge('cp-tot'); if (t) t.textContent = fm(tot);
  // Show discount row if any discount applied
  const discRow = ge('disc-row');
  const discHint = ge('disc-hint-sm');
  if (discRow && discHint) {
    const hasDisc = dAmt > 0 || discountFix > 0 || ptDeduct > 0;
    discRow.style.display = hasDisc ? 'flex' : 'none';
    let hints = [];
    if (dAmt > 0) hints.push('-' + fm(dAmt) + ' (' + discount + '%)');
    if (discountFix > 0) hints.push('-' + fm(discountFix));
    if (ptDeduct > 0) hints.push('-' + fm(ptDeduct) + ' (點數)');
    discHint.textContent = hints.join(' ');
  }
  // Update checkout button
  const btn = ge('ck-btn');
  if (btn) {
    btn.disabled = cart.length === 0;
    btn.textContent = cart.length > 0 ? '結帳   ' + fm(tot) : '結帳';
  }
}

async function doCheckout(orderNote, cashPaid) {
  if (!cart.length) return;
  const sub  = cart.reduce((s,x) => s+x.price*x.qty, 0);
  const dAmt = Math.round(sub * (discount/100));
  const ptDeduct = (usePoints && cartMember)
    ? Math.min(Math.floor(cartMember.points / shopConfig.pointsRate), Math.max(0, sub - dAmt - discountFix))
    : 0;
  const tot  = Math.max(0, sub - dAmt - discountFix - ptDeduct);
  const customer = cartMember ? cartMember.name : '散客';
  const memberId = cartMember ? cartMember.id : null;
  // note and cashPaid passed from openCheckoutModal
  orderNote = orderNote || '';
  cashPaid = cashPaid || 0;
  const changeAmt = (payMethod==='現金' && cashPaid > 0) ? Math.max(0, cashPaid - tot) : 0;
  const order = {
    id: genId(), date: today(), customer, memberId,
    items: cart.map(x => ({name:x.name,qty:x.qty,price:x.price,cat:x.cat,owner:x.owner,spec:x.spec||'',pid:x.id,variantId:x.variantId||null,refunded:false})),
    total: tot, sub, discPct: discount, discAmt: dAmt, discFix: discountFix,
    ptDeduct, ptsEarned: cartMember ? Math.floor(sub/100) : 0, redeemIds: [...redeemIds],
    note: orderNote, cashPaid, changeAmt,
    status: '完成', payment: payMethod
  };
  orders.unshift(order);
  cart.forEach(c => {
    const p=products.find(x=>x.id===c.id); if(!p) return;
    if (c.variantId) {
      const v = (p.variants||[]).find(x=>x.id===c.variantId);
      if (v) v.stock = Math.max(0, v.stock - c.qty);
      p.stock = (p.variants||[]).reduce((s,x)=>s+x.stock, 0);
    } else {
      p.stock = Math.max(0, p.stock - c.qty);
    }
  });
  if (cartMember) {
    const ptsUsed = ptDeduct * shopConfig.pointsRate;          // 折抵消耗的點數
    const ptsEarned = Math.floor(sub/100);                     // 本次消費累積點數（以小計為準，不受折扣影響）
    const redeemCost = redeemIds.reduce((s,rid) => {
      const ri = shopConfig.redeemItems.find(x=>x.id===rid);
      return s + (ri ? ri.points : 0);
    }, 0);
    cartMember.points = Math.max(0, cartMember.points - ptsUsed - redeemCost + ptsEarned);
    cartMember.totalSpend += tot;
    cartMember.tier = getTierIdBySpend(cartMember.totalSpend);
  }
  const cm = cartMember;
  cart=[]; discount=0; discountFix=0; payMethod='現金'; cartMember=null; usePoints=false; redeemIds=[];
  saveToLocal();
  // 直接、單獨把這筆新訂單寫入雲端並等待完成，確保結帳完成畫面出現前，訂單已經確實同步（不是只排隊等整批同步跑完）
  if (fbReady) {
    try { await saveDocToFB('orders', order.id, order); markItemSynced('orders', order); }
    catch(e) { console.warn('訂單同步失敗:', e); showToast('⚠ 訂單已存本機，但雲端同步失敗，請確認網路'); }
  }
  showReceiptModal(order, cm);
}

// ── 收據內容本體（.rp 裡面的 HTML），抽成獨立函式：畫面上的收據預覽、跟另開視窗列印都共用同一份內容 ──
function buildReceiptInnerHTML(order, member) {
  const pts = member ? (order.ptsEarned ?? Math.floor(order.total/100)) : 0;
  const ptDeductAmt = order.ptDeduct || 0;
  const redeemNames = (order.redeemIds||[]).map(rid => {
    const ri = shopConfig.redeemItems.find(x=>x.id===rid);
    return ri ? ri.name : '';
  }).filter(Boolean);
  return (
    '<div class="rb">' + (shopConfig.name || 'W&M 熊窩專門店') + '</div>' +
    '<div class="rs">熊 窩 專 門 店</div>' + (shopConfig.taxId ? '<div style="text-align:center;font-size:10px;color:var(--txt3);margin-bottom:4px;font-family:var(--en)">統一編號：' + shopConfig.taxId + '</div>' : '') +
    '<hr class="rhr">' +
    (shopConfig.address ? '<div style="text-align:center;font-size:10px;color:var(--txt3);margin-bottom:2px">' + shopConfig.address + '</div>' : '') +
    (shopConfig.phone ? '<div style="text-align:center;font-size:10px;color:var(--txt3);margin-bottom:4px;font-family:var(--en)">' + shopConfig.phone + '</div>' : '') +
    '<hr class="rhr">' +
    '<div class="rr"><span>訂單編號</span><span style="font-family:var(--en);font-size:11px;font-weight:600">' + order.id + '</span></div>' +
    '<div class="rr"><span>日期</span><span>' + order.date + '</span></div>' +
    (order.customer !== '散客' ? '<div class="rr"><span>客戶</span><span>' + order.customer + '</span></div>' : '') +
    '<div class="rr"><span>付款</span><span>' + order.payment + '</span></div>' +
    '<hr class="rhr">' +
    order.items.map(it => {
      const refQty = it.refundedQty || (it.refunded ? it.qty : 0);
      const allRefunded = refQty >= it.qty;
      return '<div class="rr"' + (allRefunded ? ' style="text-decoration:line-through;opacity:.5"' : '') + '>' +
        '<span>' + it.name + ' ×' + it.qty +
          (refQty>0 && !allRefunded ? '<span style="color:var(--cr);font-weight:600">（已退' + refQty + '）</span>' : '') +
          (it.spec?'<div style="font-size:10px;color:var(--txt3);line-height:1.4;margin-top:1px">'+it.spec+'</div>':'') +
        '</span>' +
        '<span style="font-family:var(--en);font-weight:600">' + fm(it.price*it.qty) + '</span>' +
      '</div>';
    }).join('') +
    '<hr class="rhr">' +
    (order.discPct>0 ? '<div class="rr"><span>折扣 '+order.discPct+'%</span><span style="font-family:var(--en);color:var(--cr)">-'+fm(order.discAmt)+'</span></div>' : '') +
    (order.discFix>0 ? '<div class="rr"><span>折扣金額</span><span style="font-family:var(--en);color:var(--cr)">-'+fm(order.discFix)+'</span></div>' : '') +
    (ptDeductAmt>0 ? '<div class="rr"><span>點數折抵</span><span style="font-family:var(--en);color:var(--gold)">-'+fm(ptDeductAmt)+'</span></div>' : '') +
    (redeemNames.length>0 ? '<div class="rr"><span>兌換獎勵</span><span style="font-size:11.5px;color:var(--gold)">'+redeemNames.join('、')+'</span></div>' : '') +
    '<div class="rr rtot"><span>合計</span><span style="font-family:var(--en);color:var(--cr);font-size:16px">' + fm(order.total) + '</span></div>' +
    (member ? '<div class="rr" style="margin-top:6px"><span>點數異動</span><span style="font-family:var(--en);color:var(--gold);font-weight:700">+'+pts+' pt　餘 '+member.points+' pt</span></div>' : '') +
    (order.cashPaid > 0 ? '<div class="rr" style="margin-top:6px"><span>客付金額</span><span style="font-family:var(--en);font-weight:600">$' + order.cashPaid.toLocaleString() + '</span></div>' : '') +
    (order.cashPaid > 0 ? '<div class="rr"><span>找零</span><span style="font-family:var(--en);font-weight:700;color:var(--cr)">$' + order.changeAmt.toLocaleString() + '</span></div>' : '') +
    (order.note ? '<div style="margin-top:10px;padding:8px 10px;background:var(--p2);border-radius:4px;font-size:11.5px;color:var(--txt2)"><strong>備註：</strong>' + order.note + '</div>' : '') +
    '<div style="text-align:center;font-size:11px;color:var(--txt3);margin-top:12px">' + (shopConfig.note || '感謝光臨，歡迎再次蒞臨熊窩') + '</div>'
  );
}

// ── 另開一個乾淨的獨立視窗來列印收據，完全不依賴主系統畫面的版面/CSS，避免 Safari 對 @media print 動態切換的相容性問題 ──
function printReceiptStandalone(order, member) {
  const inner = buildReceiptInnerHTML(order, member);
  const win = window.open('', '_blank', 'width=420,height=680');
  if (!win) { alert('瀏覽器擋住了列印視窗的彈出，請到瀏覽器設定允許此網站的快顯視窗，再試一次列印'); return; }
  win.document.open();
  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="utf-8"><title>收據列印 ' + order.id + '</title><style>' +
      ':root{--txt:#5C4A3A;--txt2:#7A6A5A;--txt3:#B0A090;--cr:#7BB8D4;--gold:#F5C842;--p2:#F5EFE6;--en:\'Nunito\',sans-serif;--zh:\'Noto Sans TC\',sans-serif}' +
      '@page{size:80mm auto;margin:4mm}' +
      '*{box-sizing:border-box;margin:0;padding:0}' +
      "body{font-family:var(--zh);color:var(--txt);font-size:14px;padding:16px;background:#fff}" +
      '.rp{max-width:100%;margin:0 auto}' +
      ".rb{text-align:center;font-family:var(--en);font-style:italic;font-weight:700;font-size:17px;color:var(--txt)}" +
      ".rs{text-align:center;font-family:var(--zh);font-size:10.5px;color:var(--txt3);letter-spacing:3px;margin-bottom:12px}" +
      '.rhr{border:none;border-top:1px dashed #000;margin:9px 0}' +
      '.rr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--txt)}' +
      '.rtot{font-weight:700;font-size:13.5px}' +
    '</style></head><body><div class="rp">' + inner + '</div></body></html>'
  );
  win.document.close();
  const doPrint = () => { try { win.focus(); win.print(); } catch(e) { console.warn('列印視窗錯誤:', e); } };
  win.onload = doPrint;
  setTimeout(doPrint, 300); // 保險：某些瀏覽器 document.write 後 onload 不一定會觸發
}

function showReceiptModal(order, member, onClose) {
  const receiptInner = buildReceiptInnerHTML(order, member);
  const ov = document.createElement('div'); ov.className='ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:360px">' +
      '<div class="mhd"><div class="mttl">結帳完成</div><button class="btn-g" id="rct-x">' + IC.x + '</button></div>' +
      '<div class="mbd"><div class="rp">' + receiptInner + '</div></div>' +
      '<div class="mft">' +
        '<button class="btn btn-o" id="rct-close">關閉</button>' +
        '<button class="btn btn-p" id="rct-print">' + IC.print + ' 列印</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => { ov.remove(); (onClose || PF.pos)(); };
  ov.querySelector('#rct-x').addEventListener('click', close);
  ov.querySelector('#rct-close').addEventListener('click', close);
  ov.querySelector('#rct-print').addEventListener('click', () => {
    printReceiptStandalone(order, member);
  });
}

  html +=

      '</select>' +

        '<button class="tab' + (invTab==='all'?' on':'') + '" id="inv-all">全部</button>' +

      '</div>' +
    '</div>' +
    '<div id="inv-wrap">' +
      '<div class="bulk-bar">' +

        '<button class="btn btn-sm bulk-desel-all" style="background:rgba(255,255,255,.12);color:var(--p);border-color:rgba(255,255,255,.2)">取消</button>' +
        '<button class="btn btn-sm bulk-del-btn" disabled style="background:#b71c1c;color:#fff;border-color:#b71c1c;margin-left:auto">🗑 刪除選取</button>' +
      '</div>' +
      '<div class="card" style="border-top:none;border-radius:0 0 var(--r2) var(--r2)"><div class="tw"><table>' +
        '<thead><tr><th class="cb-th" style="width:36px"></th><th style="min-width:130px">商品名稱</th><th>闆娘</th><th>分類</th><th>售價</th><th class="hide-mob">成本</th><th>庫存</th><th class="hide-mob">狀態</th><th>操作</th></tr></thead>' +

  ge('inv-owner-sel').addEventListener('change', function(){ invOwner=this.value; renderInvTable(); });

function renderInvTable() {
  const tb = ge('inv-tbody'); if (!tb) return;
  const list = products
    .filter(p => {
      const mq = p.name.includes(invSearch) || p.cat.includes(invSearch);
      const mo = invOwner==='全部' || p.owner===invOwner;
      return mo && (invTab==='low' ? mq && p.stock<=p.lowStock : mq);
    })
    .sort((a,b) => (a.sortOrder??999) - (b.sortOrder??999));
  tb.innerHTML = list.map(p => {
    const gr = Math.round(((p.price-p.cost)/p.price)*100);
    return '<tr class="' + (p.stock<=p.lowStock?'rw':'') + '">' +
      '<td class="cb-td" style="width:36px;padding:8px 6px;text-align:center"><input type="checkbox" class="row-cb" data-id="' + p.id + '" onclick="event.stopPropagation()"></td>' +
      '<td style="font-weight:600;min-width:120px;white-space:normal">' + p.name + (p.variants&&p.variants.length?'<div style="font-size:10.5px;color:var(--gold,#a67c3d);font-weight:600;margin-top:2px">🎨 '+p.variants.length+' 種規格</div>':(p.spec?'<div style="font-size:11px;color:var(--txt3);font-weight:400;margin-top:2px">'+p.spec+'</div>':'')) + '</td>' +
      '<td>' + ownerTag(p.owner) + '</td>' +
      '<td><span class="bdg bi">' + p.cat + '</span></td>' +
      '<td class="tn">' + fm(p.price) + '</td>' +
      '<td class="tn hide-mob" style="color:var(--txt3)">' + fm(p.cost) + '</td>' +
      '<td><strong class="tn">' + p.stock + '</strong> <span style="color:var(--txt3);font-size:11px">' + p.unit + '</span></td>' +
      '<td class="hide-mob">' + (p.stock===0?'<span class="bdg br">缺貨</span>':p.stock<=p.lowStock?'<span class="bdg ba">偏低</span>':'<span class="bdg bg">正常</span>') + '</td>' +
      '<td><div style="display:flex;gap:5px">' +
        '<div style="display:flex;flex-direction:column;gap:2px;margin-right:2px">' +
          '<button class="btn btn-o btn-sm inv-up" data-id="' + p.id + '" style="padding:1px 7px;min-width:unset;line-height:1.4" title="上移">↑</button>' +
          '<button class="btn btn-o btn-sm inv-dn" data-id="' + p.id + '" style="padding:1px 7px;min-width:unset;line-height:1.4" title="下移">↓</button>' +
        '</div>' +
        '<button class="btn btn-p btn-sm inv-restock" data-id="' + p.id + '">進貨</button>' +
        '<button class="btn btn-o btn-sm inv-edit" data-id="' + p.id + '">編輯</button>' +
        '<button class="btn btn-d btn-sm inv-del" data-id="' + p.id + '">' + IC.trash + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
  tb.querySelectorAll('.inv-up').forEach(b => b.addEventListener('click', () => {
    const sorted = [...products].sort((a,b2) => (a.sortOrder??999)-(b2.sortOrder??999));
    const idx = sorted.findIndex(p => p.id===b.dataset.id);
    if (idx <= 0) return;
    [sorted[idx].sortOrder, sorted[idx-1].sortOrder] = [sorted[idx-1].sortOrder, sorted[idx].sortOrder];
    saveToLocal(); renderInvTable();
  }));
  tb.querySelectorAll('.inv-dn').forEach(b => b.addEventListener('click', () => {
    const sorted = [...products].sort((a,b2) => (a.sortOrder??999)-(b2.sortOrder??999));
    const idx = sorted.findIndex(p => p.id===b.dataset.id);
    if (idx < 0 || idx >= sorted.length-1) return;
    [sorted[idx].sortOrder, sorted[idx+1].sortOrder] = [sorted[idx+1].sortOrder, sorted[idx].sortOrder];
    saveToLocal(); renderInvTable();
  }));
  tb.querySelectorAll('.inv-restock').forEach(b => b.addEventListener('click', () => openRestockModal(b.dataset.id)));
  tb.querySelectorAll('.inv-edit').forEach(b => b.addEventListener('click', () => openProdModal(b.dataset.id)));
  tb.querySelectorAll('.inv-del').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('確定刪除此商品？')) return;
    const delId = b.dataset.id;
    products = products.filter(p => p.id !== delId);
    saveToLocal();
    if (fbReady) { try { await deleteDocFromFB('products', delId); } catch(e) { console.warn(e); } }
    renderInvTable();
  }));
  // bulk select
  makeBulkBar('inv-wrap',
    () => list.map(p => p.id),
    ids => { products = products.filter(p => !ids.includes(p.id)); },
    () => renderInvTable(),
    'products'
  );
}

function openRefundModal({ title, desc, maxQty, unitPrice, onConfirm }) {
  const showQty = maxQty && maxQty > 1;
  const ov = document.createElement('div'); ov.className = 'ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:420px">' +
      '<div class="mhd"><div class="mttl">⚠ ' + title + '</div><button class="btn-g" id="rf-x">' + IC.x + '</button></div>' +
      '<div class="mbd">' +
        '<div style="padding:14px 18px 10px">' +
          '<div style="background:var(--p2);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px">' +
            '<div style="font-size:11px;color:var(--txt3);margin-bottom:3px">退款項目</div>' +
            '<strong>' + desc + '</strong>' +
          '</div>' +
          (showQty ?
            '<div class="fg" style="margin:0 0 12px">' +
              '<label>退款數量 <span style="font-size:11px;font-weight:400;color:var(--txt3)">（最多可退 ' + maxQty + ' 個）</span></label>' +
              '<div style="display:flex;align-items:center;gap:10px">' +
                '<div style="display:flex;align-items:center;gap:6px">' +
                  '<button type="button" id="rf-qty-d" style="width:28px;height:28px;border-radius:50%;border:1.5px solid var(--p3);background:var(--p);cursor:pointer;font-size:16px;font-weight:700;color:var(--cr);display:flex;align-items:center;justify-content:center;line-height:1">−</button>' +
                  '<span id="rf-qty-val" style="font-family:var(--en);font-size:18px;font-weight:700;min-width:28px;text-align:center">1</span>' +
                  '<button type="button" id="rf-qty-u" style="width:28px;height:28px;border-radius:50%;border:1.5px solid var(--p3);background:var(--p);cursor:pointer;font-size:16px;font-weight:700;color:var(--cr);display:flex;align-items:center;justify-content:center;line-height:1">+</button>' +
                '</div>' +
                '<span id="rf-amt-preview" style="font-family:var(--en);font-size:14px;font-weight:700;color:var(--cr)">= ' + fm(unitPrice||0) + '</span>' +
              '</div>' +
            '</div>'
          : '') +
          '<div class="fg" style="margin:0">' +
            '<label>退款原因 <span style="font-size:11px;font-weight:400;color:var(--txt3)">（選填）</span></label>' +
            '<textarea class="fi" id="rf-note" rows="2" placeholder="例：客人改變心意、尺寸不符…" style="width:100%;resize:none;line-height:1.6"></textarea>' +
          '</div>' +
          '<label id="rf-defective-label" style="display:flex;align-items:center;gap:9px;cursor:pointer;margin-top:10px;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--p3);transition:all .18s">' +
            '<input type="checkbox" id="rf-defective" style="width:16px;height:16px;accent-color:var(--cr);flex-shrink:0">' +
            '<div>' +
              '<div style="font-size:13px;font-weight:600;color:var(--cr)">🚫 商品瑕疵 / 損壞</div>' +
              '<div style="font-size:11.5px;color:var(--txt3);margin-top:1px">勾選後庫存<strong>不會</strong>自動加回，此商品將不再販售</div>' +
            '</div>' +
          '</label>' +
          '<div id="rf-warn" style="margin-top:10px;font-size:12px;color:#7a5800;background:#fff8e6;border:1px solid #ffe08a;border-radius:5px;padding:8px 12px">⚠ 退款後將自動還原庫存，此操作無法復原，請確認後再送出。</div>' +
          (isStaffMode() ?
            '<div style="margin-top:10px;padding:10px 12px;background:var(--cr-lt);border-radius:var(--r)">' +
              '<label style="font-size:12px;font-weight:600;color:var(--cr2);display:block;margin-bottom:6px">👑 退款需要闆娘授權碼</label>' +
              '<input type="password" id="rf-owner-pin" class="fi" placeholder="請闆娘輸入授權碼" inputmode="numeric" style="text-align:center;letter-spacing:4px">' +
              '<div id="rf-owner-pin-err" style="font-size:11px;color:var(--cr);height:14px;margin-top:4px"></div>' +
            '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="mft">' +
        '<button class="btn btn-o" id="rf-cancel">取消，回上一步</button>' +
        '<button class="btn btn-d" id="rf-confirm">確認退款</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ge('rf-x').addEventListener('click', close);
  ge('rf-cancel').addEventListener('click', close);

  // 數量控制
  let rfQty = 1;
  if (showQty) {
    const updateQtyUI = () => {
      ge('rf-qty-val').textContent = rfQty;
      ge('rf-amt-preview').textContent = '= ' + fm(rfQty * (unitPrice||0));
      ge('rf-qty-d').disabled = rfQty <= 1;
      ge('rf-qty-u').disabled = rfQty >= maxQty;
    };
    ge('rf-qty-d').addEventListener('click', () => { if (rfQty>1) { rfQty--; updateQtyUI(); } });
    ge('rf-qty-u').addEventListener('click', () => { if (rfQty<maxQty) { rfQty++; updateQtyUI(); } });
    updateQtyUI();
  }

  // 瑕疵勾選互動
  const defChk = ge('rf-defective');
  const warnEl = ge('rf-warn');
  const lblEl  = ge('rf-defective-label');
  defChk.addEventListener('change', function() {
    if (this.checked) {
      warnEl.style.background = '#fdecea';
      warnEl.style.borderColor = '#f5c0bd';
      warnEl.style.color = '#b71c1c';
      warnEl.textContent = '🚫 瑕疵模式：退款後庫存不會加回，此商品將從可販售庫存中移除。';
      lblEl.style.borderColor = 'var(--cr)';
      lblEl.style.background = '#fdecea';
    } else {
      warnEl.style.background = '#fff8e6';
      warnEl.style.borderColor = '#ffe08a';
      warnEl.style.color = '#7a5800';
      warnEl.textContent = '⚠ 退款後將自動還原庫存，此操作無法復原，請確認後再送出。';
      lblEl.style.borderColor = 'var(--p3)';
      lblEl.style.background = '';
    }
  });

  ge('rf-confirm').addEventListener('click', () => {
    if (isStaffMode()) {
      const pinEl = ge('rf-owner-pin');
      if (!pinEl || pinEl.value.trim() !== getRolePin()) {
        ge('rf-owner-pin-err').textContent = '授權碼錯誤，請闆娘輸入';
        if (pinEl) { pinEl.value = ''; pinEl.focus(); }
        return;
      }
    }
    const defective = ge('rf-defective').checked;
    let note = ge('rf-note').value.trim();
    if (defective && !note) note = '商品瑕疵／損壞';
    else if (defective) note = '【瑕疵／損壞】' + note;
    const qty = showQty ? rfQty : (maxQty || null);
    close();
    onConfirm(note, qty, defective);
  });
}

  const existing = rid ? shopConfig.redeemItems.find(x => x.id===rid) : null;

  const ov = document.createElement('div'); ov.className = 'ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:380px">' +
      '<div class="mhd"><div class="mttl">' + (isEdit ? '✏ 編輯獎勵' : '＋ 新增獎勵') + '</div><button class="btn-g" id="ri-x">' + IC.x + '</button></div>' +
      '<div class="mbd" style="padding:18px 20px">' +
        '<div class="fg"><label>獎勵名稱</label>' +
          '<input class="fi" id="ri-name" value="' + (existing?.name||'') + '" placeholder="例：免費磨爪服務、神秘小禮物"></div>' +
        '<div class="fg"><label>所需點數</label>' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<input class="fi" id="ri-pts" type="number" min="1" value="' + (existing?.points||'') + '" placeholder="例：300" style="width:100px">' +
            '<span style="font-size:13px;color:var(--txt3)">pt</span>' +
          '</div></div>' +
      '</div>' +
      '<div class="mft">' +
        '<button class="btn btn-o" id="ri-cancel">取消</button>' +
        '<button class="btn btn-p" id="ri-save">' + IC.check + (isEdit ? ' 儲存' : ' 新增') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  ge('ri-name').focus();
  const close = () => ov.remove();
  ge('ri-x').addEventListener('click', close);
  ge('ri-cancel').addEventListener('click', close);
  ge('ri-save').addEventListener('click', () => {
    const name = ge('ri-name').value.trim();
    const pts  = parseInt(ge('ri-pts').value);
    if (!name) { showToast('請輸入獎勵名稱'); return; }
    if (!pts || pts < 1) { showToast('請輸入有效點數'); return; }
    if (isEdit) {
      const i = shopConfig.redeemItems.findIndex(x => x.id===rid);
      if (i !== -1) shopConfig.redeemItems[i] = { ...shopConfig.redeemItems[i], name, points: pts };
    } else {
      shopConfig.redeemItems.push({ id: 'RI' + Date.now(), name, points: pts });
    }
    saveToLocal();
    close();
    showToast(isEdit ? '獎勵已更新：' + name : '已新增獎勵：' + name);
    PF.settings();
  });
}

function openRestockModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const hasVariants = p.variants && p.variants.length > 0;
  const ov = document.createElement('div'); ov.className = 'ovm';
  ov.innerHTML =
    '<div class="modal" style="max-width:380px">' +
      '<div class="mhd"><div class="mttl">📦 進貨 — ' + p.name + '</div><button class="btn-g" id="rs-x">' + IC.x + '</button></div>' +
      '<div class="mbd">' +
        '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;margin-bottom:14px;background:var(--p2);border-radius:var(--r);padding:10px 14px">' +
          '<span style="font-size:13px;color:var(--txt2)">目前庫存</span>' +
          '<strong style="font-family:var(--en);font-size:18px;color:var(--cr);margin-left:auto" id="rs-cur-stock">' + p.stock + ' <span style="font-size:13px;font-weight:400;color:var(--txt3)">' + p.unit + '</span></strong>' +
        '</div>' +
        (hasVariants ? '<div class="fg"><label>選擇規格</label><select class="fs" id="rs-variant">' + p.variants.map(v=>'<option value="'+v.id+'">'+v.name+'（目前 '+v.stock+' '+p.unit+'）</option>').join('') + '</select></div>' : '') +
        '<div class="fg" style="margin-top:12px"><label>進貨數量</label><input class="fi" type="number" id="rs-qty" min="1" placeholder="請輸入數量" autofocus></div>' +
        '<div class="fg" style="margin-top:12px"><label>備註（選填）</label><input class="fi" id="rs-note" placeholder="例：向三豐補貨、特價入貨…"></div>' +
      '</div>' +
      '<div class="mft"><button class="btn btn-o" id="rs-cancel">取消</button><button class="btn btn-p" id="rs-save">' + IC.check + ' 確認進貨</button></div>' +
    '</div>';
  document.body.appendChild(ov);
  ge('rs-qty').focus();
  const close = () => ov.remove();
  ge('rs-x').addEventListener('click', close);
  ge('rs-cancel').addEventListener('click', close);
  if (hasVariants) {
    ge('rs-variant').addEventListener('change', function() {
      const v = p.variants.find(x=>x.id===this.value);
      ge('rs-cur-stock').innerHTML = (v?v.stock:0) + ' <span style="font-size:13px;font-weight:400;color:var(--txt3)">' + p.unit + '</span>';
    });
  }
  ge('rs-save').addEventListener('click', () => {
    const qty = parseInt(ge('rs-qty').value);
    if (!qty || qty <= 0) { showToast('請輸入有效進貨數量'); return; }
    const note = ge('rs-note').value.trim();
    const now = new Date();
    const ts = now.getFullYear() + '-' +
      String(now.getMonth()+1).padStart(2,'0') + '-' +
      String(now.getDate()).padStart(2,'0') + ' ' +
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0');
    let before, after, variantId = null, variantName = '';
    if (hasVariants) {
      variantId = ge('rs-variant').value;
      const v = p.variants.find(x=>x.id===variantId);
      if (!v) { showToast('請選擇規格'); return; }
      variantName = v.name;
      before = v.stock;
      v.stock += qty;
      after = v.stock;
      p.stock = p.variants.reduce((s,x)=>s+x.stock,0);
    } else {
      before = p.stock;
      p.stock += qty;
      after = p.stock;
    }
    restockLog.unshift({ id: genId(), pid: p.id, name: p.name + (variantName?'（'+variantName+'）':''), owner: p.owner, qty, before, after, ts, note });
    saveToLocal();
    close();
    showToast('✅ ' + p.name + (variantName?'（'+variantName+'）':'') + ' 已進貨 +' + qty + p.unit + '，現庫存 ' + (hasVariants?after:p.stock) + p.unit);
    renderInvTable();
  });
}

      '<div class="mbd" style="padding:0">' +
        (restockLog.length > 0
          ? '<div class="tw"><table>' +
              '<thead><tr><th>時間</th><th>商品</th><th>闆娘</th><th>進貨量</th><th>庫存變化</th><th>備註</th></tr></thead>' +
              '<tbody>' + rows + '</tbody>' +
            '</table></div>'
          : rows) +
      '</div>' +
      '<div class="mft"><button class="btn btn-o" id="rl-close">關閉</button><button class="btn btn-o" id="rl-export">' + IC.dl + ' 匯出 CSV</button></div>' +
